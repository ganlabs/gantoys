<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script>
        (function () {
            function syncThemeCss(cssText) {
                try {
                    const css = cssText || localStorage.getItem('gantoys_theme_css');
                    if (!css || !document.head) return;

                    const existingStyle = document.getElementById('gantoys-theme-inject');
                    if (existingStyle) existingStyle.remove();

                    const style = document.createElement('style');
                    style.id = 'gantoys-theme-inject';
                    style.textContent = css;
                    document.head.appendChild(style);
                } catch (e) {}
            }

            function applyTheme(theme, visual, cssText) {
                if (theme) document.documentElement.setAttribute('data-theme', theme);
                if (visual) document.documentElement.setAttribute('data-visual', visual);
                if (cssText) {
                    try { localStorage.setItem('gantoys_theme_css', cssText); } catch (e) {}
                }
                syncThemeCss(cssText);
            }

            try {
                applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), localStorage.getItem('visual') || 'glassmorphism', localStorage.getItem('gantoys_theme_css'));
            } catch (e) {}

            document.addEventListener('DOMContentLoaded', function () {
                syncThemeCss();
            });

            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'theme') {
                    applyTheme(e.data.theme, e.data.visual, e.data.css);
                }
            });

            function forwardPointer(e) {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'toy-pointer', x: e.clientX, y: e.clientY }, '*');
                    }
                } catch (err) {}
            }

            window.addEventListener('pointermove', forwardPointer, { capture: true, passive: true });
            window.addEventListener('mousemove', forwardPointer, { capture: true, passive: true });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisor de PDF</title>
    <link rel="icon" href="../../favicon.png" type="image/png">
    <link rel="stylesheet" href="../shared/toy.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="shell">
        <header class="brand">
            <img src="../../favicon.png" alt="GAN" class="brand-logo">
            <h1>Divisor de PDF</h1>
            <p>Divida um PDF em partes menores que o tamanho máximo informado.</p>
        </header>

        <section class="glass-card" aria-label="Divisor e otimizador de PDF">
            <div class="panel">
                <div class="card-heading">
                    <h2>Arquivo de origem</h2>
                    <p>Arraste o PDF ou clique na área para selecioná-lo.</p>
                </div>

                <div id="drop-zone" class="drop-zone">
                    <input type="file" id="file-input" accept="application/pdf" hidden>
                    <span class="drop-zone-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload-cloud"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
                    </span>
                    <span id="file-name" class="drop-zone-title">Arraste seu PDF ou <strong>clique aqui</strong></span>
                    <span class="drop-zone-desc" id="file-size-info"></span>
                </div>

                <div class="field-grid">
                    <div>
                        <label class="input-label" for="max-size">Tamanho máximo por parte (MB)</label>
                        <input type="number" id="max-size" min="0.1" step="0.1" placeholder="Ex: 3.0" value="3.0">
                    </div>
                </div>

                <div class="actions">
                    <button id="process-btn" class="btn btn-primary" disabled>
                        <span>Processar Arquivo</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>

                <!-- `.visible` fixo: o script alterna apenas a classe `.hidden`. -->
                <section id="status-section" class="progress-area visible hidden" aria-live="polite">
                    <div class="progress-top">
                        <span id="status-message">Aguardando...</span>
                    </div>
                    <div class="progress-wrap">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </section>

                <section id="results-section" class="stack hidden">
                    <div class="card-heading">
                        <h2>Resultado</h2>
                        <p id="result-summary"></p>
                    </div>
                    <button id="download-btn" class="btn btn-outline btn-block">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Baixar Todas as Partes (ZIP)
                    </button>
                    <div id="individual-files" class="individual-files"></div>
                </section>
            </div>
        </section>
    </main>

    <!-- Dependencies -->
    <script src="../../vendor/pdf-lib/pdf-lib.min.js"></script>
    <script src="../../vendor/jszip/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
