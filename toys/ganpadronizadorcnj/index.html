<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function () {
            function syncThemeCss(cssText) {
                try {
                    const css = cssText || localStorage.getItem('gantoys_theme_css');
                    if (!css || !document.head) return;

                    const existingStyle = document.getElementById('gantoys-theme-inject');
                    if (existingStyle) existingStyle.remove();

                    const style = document.createElement('style');
                    style.id = 'gantoys-theme-inject';
                    style.textContent = css;
                    document.head.appendChild(style);
                } catch (e) {}
            }

            function applyTheme(theme, visual, cssText) {
                if (theme) document.documentElement.setAttribute('data-theme', theme);
                if (visual) document.documentElement.setAttribute('data-visual', visual);
                if (cssText) {
                    try { localStorage.setItem('gantoys_theme_css', cssText); } catch (e) {}
                }
                syncThemeCss(cssText);
            }

            try {
                applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), localStorage.getItem('visual') || 'glassmorphism', localStorage.getItem('gantoys_theme_css'));
            } catch (e) {}

            document.addEventListener('DOMContentLoaded', function () {
                syncThemeCss();
            });

            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'theme') {
                    applyTheme(e.data.theme, e.data.visual, e.data.css);
                }
            });

            function forwardPointer(e) {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'toy-pointer', x: e.clientX, y: e.clientY }, '*');
                    }
                } catch (err) {}
            }

            window.addEventListener('pointermove', forwardPointer, { capture: true, passive: true });
            window.addEventListener('mousemove', forwardPointer, { capture: true, passive: true });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padronizador CNJ</title>
    <link rel="icon" type="image/svg+xml" href="../shared/logo.svg">
    <link rel="stylesheet" href="../shared/toy.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="shell">
        <header class="brand">
            <img class="brand-logo" src="../shared/logo.svg" alt="GAN Toys">
            <h1>Padronizador CNJ</h1>
            <p>Converta listas de processos entre formato pontuado e despontuado.</p>
        </header>

        <section class="glass-card" aria-label="Padronizador de números CNJ">
            <div class="panel">
                <div class="card-heading">
                    <h2>Entrada</h2>
                    <p>Um processo por linha</p>
                </div>

                <div>
                    <label class="input-label" for="processInput">Lista de processos</label>
                    <textarea id="processInput" spellcheck="false" placeholder="00000018920238260100&#10;0000002-90.2024.8.26.0100"></textarea>
                </div>

                <div class="card-heading">
                    <h2>Modo</h2>
                    <p>Escolha como a saída deve ser gerada</p>
                </div>

                <div class="row" role="radiogroup" aria-label="Modo de padronização CNJ">
                    <label class="check-row">
                        <input type="radio" name="mode" value="pontuar" checked>
                        <span>Pontuar</span>
                    </label>
                    <label class="check-row">
                        <input type="radio" name="mode" value="despontuar">
                        <span>Despontuar</span>
                    </label>
                </div>

                <div class="actions">
                    <button id="processBtn" class="btn btn-primary" type="button">Processar Lista</button>
                </div>

                <section id="resultsSection" class="stack hidden" aria-live="polite">
                    <div class="card-heading results-header">
                        <div>
                            <h2>Resultado</h2>
                            <p id="resultSummary">0 processos convertidos</p>
                        </div>
                        <button id="copyBtn" class="btn btn-outline btn-small" type="button">Copiar para a Memória</button>
                    </div>

                    <div id="emptyState" class="notice hidden">Nenhuma linha válida informada.</div>
                    <div id="resultsList" class="result-list"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
