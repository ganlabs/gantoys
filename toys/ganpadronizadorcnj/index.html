<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function () {
            function syncThemeCss(cssText) {
                try {
                    const css = cssText || localStorage.getItem('gantoys_theme_css');
                    if (!css || !document.head) return;

                    const existingStyle = document.getElementById('gantoys-theme-inject');
                    if (existingStyle) existingStyle.remove();

                    const style = document.createElement('style');
                    style.id = 'gantoys-theme-inject';
                    style.textContent = css;
                    document.head.appendChild(style);
                } catch (e) {}
            }

            function applyTheme(theme, visual, cssText) {
                if (theme) document.documentElement.setAttribute('data-theme', theme);
                if (visual) document.documentElement.setAttribute('data-visual', visual);
                if (cssText) {
                    try { localStorage.setItem('gantoys_theme_css', cssText); } catch (e) {}
                }
                syncThemeCss(cssText);
            }

            try {
                applyTheme(localStorage.getItem('theme') || 'dark', localStorage.getItem('visual') || 'glassmorphism', localStorage.getItem('gantoys_theme_css'));
            } catch (e) {}

            document.addEventListener('DOMContentLoaded', function () {
                syncThemeCss();
            });

            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'theme') {
                    applyTheme(e.data.theme, e.data.visual, e.data.css);
                }
            });

            function forwardPointer(e) {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'toy-pointer', x: e.clientX, y: e.clientY }, '*');
                    }
                } catch (err) {}
            }

            window.addEventListener('pointermove', forwardPointer, { capture: true, passive: true });
            window.addEventListener('mousemove', forwardPointer, { capture: true, passive: true });
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padronizador CNJ</title>
    <link rel="icon" href="../../favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="toy-header">
        <img src="../../favicon.png" alt="Logo" class="logo">
        <h1>Padronizador CNJ</h1>
        <p>Converta listas de processos entre formato pontuado e despontuado.</p>
    </header>

    <main class="glass-container">
        <section class="input-section">
            <div class="section-heading">
                <h2>Entrada</h2>
                <span>Um processo por linha</span>
            </div>

            <label class="field-label" for="processInput">Lista de processos</label>
            <textarea id="processInput" placeholder="00000018920238260100&#10;0000002-90.2024.8.26.0100"></textarea>
        </section>

        <section class="settings-section">
            <div class="section-heading">
                <h2>Modo</h2>
                <span>Escolha como a saída deve ser gerada</span>
            </div>

            <div class="mode-selector" role="radiogroup" aria-label="Modo de padronização CNJ">
                <label class="mode-option">
                    <input type="radio" name="mode" value="pontuar" checked>
                    <span>Pontuar</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="despontuar">
                    <span>Despontuar</span>
                </label>
            </div>
        </section>

        <section class="actions-section">
            <button id="processBtn" class="primary-btn" type="button">Processar Lista</button>
        </section>

        <section id="resultsSection" class="results-section hidden" aria-live="polite">
            <div class="results-header">
                <div>
                    <h3>Resultado</h3>
                    <p id="resultSummary">0 processos convertidos</p>
                </div>
                <button id="copyBtn" class="secondary-btn" type="button">Copiar para a Memória</button>
            </div>

            <div id="emptyState" class="empty-state hidden">Nenhuma linha válida informada.</div>
            <div id="resultsList" class="results-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
