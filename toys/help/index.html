# Divisor de PDF

Divide um PDF em partes menores que o tamanho máximo em megabytes informado, testando a soma das páginas antes de fechar cada bloco. Entra um arquivo `.pdf`; saem as partes nomeadas em sequência e um ZIP com todas elas.

## Requisitos

- `pdf-lib` e `jszip` vêm do próprio projeto (`../../vendor/pdf-lib/pdf-lib.min.js` e `../../vendor/jszip/jszip.min.js`); nenhum download externo é feito.
- Um único arquivo por vez, com tipo `application/pdf`.
- O arquivo é lido na máquina do usuário; nada é enviado para a internet.

## Passo a passo

1. Arraste um `.pdf` para a área de seleção ou clique nela e escolha o arquivo. O nome escolhido substitui o texto da área e a linha abaixo passa a mostrar `Tamanho Original: X.XX MB`.
2. Ajuste `Tamanho máximo por parte (MB)` se não quiser usar `3.0`.
3. Clique em `Processar Arquivo`. A faixa de status mostra, em ordem, `Lendo arquivo original...`, `Otimizando e carregando PDF...`, `Analisando N páginas...`, `Processando página X de Y...` e `Finalizando arquivos...`, com a barra acompanhando.
4. Confira o resumo e a lista de partes. Clique em `Baixar Todas as Partes (ZIP)` para levar tudo de uma vez, ou clique no nome de uma parte para baixá-la isolada.

## Campos e controles

- **Área de seleção** — aceita clique e arraste. O texto inicial é `Arraste seu PDF ou clique aqui`; depois da escolha passa a `<nome do arquivo> selecionado`. Arquivo que não seja PDF dispara `Por favor, selecione um arquivo PDF válido.` e a seleção é limpa.
- **Tamanho Original** — apenas informativo, com o tamanho do arquivo em MB com duas casas.
- **Tamanho máximo por parte (MB)** — campo numérico, mínimo `0.1`, passo `0.1`, valor padrão `3.0`, placeholder `Ex: 3.0`. Valor vazio, zero ou negativo dispara `Por favor, insira um tamanho máximo válido.` e o processamento não começa.
- **Processar Arquivo** — fica desabilitado enquanto nenhum arquivo foi escolhido e durante todo o processamento; volta a ficar ativo no fim, inclusive em caso de erro.

## Resultado

- O bloco `Resultado` aparece com o resumo `O arquivo foi dividido em N parte(s) menores que X MB.`
- Lista de links `NOME_parte_1.pdf`, `NOME_parte_2.pdf` e assim por diante, cada um exibido com o tamanho no formato `(X.XX MB)`.
- `Baixar Todas as Partes (ZIP)` gera o arquivo `NOME_dividido.zip` com todas as partes dentro.
- Em todos os nomes, `NOME` é o nome do arquivo original sem a extensão `.pdf`.
- Os arquivos são salvos na pasta de downloads do navegador; o toy não grava em outra pasta.

## Avisos e limitações

- `Ocorreu um erro ao processar o arquivo. Detalhes no console.` — falha ao ler o arquivo ou ao montar os PDFs. A faixa de status volta para `Erro no processamento.` com 0%, e o detalhe técnico fica no console do navegador.
- Uma página sozinha maior que o limite não pode ser reduzida: ela vira uma parte própria, ainda acima do tamanho pedido.
- O toy não compacta nem reamostra imagens nem fontes; o tamanho de cada parte é o do PDF reescrito pelo `pdf-lib`, que costuma ficar próximo do original.
- A divisão é sempre sequencial a partir da página 1 e não aceita intervalo inicial nem ordem diferente das páginas.
- A lista de partes fica só na tela até o clique; se a página for recarregada, a seleção e as partes são perdidas.
- O botão de ZIP não faz nada enquanto a lista de partes estiver vazia.
- Nenhuma página é descartada: a soma das páginas das partes é o total do documento.

## Detalhes técnicos

- O limite em megabytes é convertido para bytes por multiplicação por 1024 duas vezes.
- O algoritmo percorre as páginas em ordem. Para cada página monta um PDF de teste com todas as páginas do bloco corrente mais a página nova, salva em memória e compara o tamanho com o limite.
- Se o teste estourar o limite e o bloco já tiver ao menos uma página, o último bloco válido é fechado e a página atual passa a ser a primeira do próximo bloco. Se o bloco estiver vazio, a página é aceita mesmo acima do limite, garantindo que uma página grande não trave o processo.
- O bloco válido anterior é sempre reaproveitado, então nenhuma página é duplicada entre partes.
- A barra vai de 20% a 80% durante o laço de páginas, usa 5% e 15% nas leituras iniciais, 90% em `Finalizando arquivos...` e 100% em `Concluído!`; o bloco de resultado só aparece depois de uma pausa curta.
- O ZIP é montado no navegador com `JSZip.generateAsync` e a URL temporária é liberada um segundo após o clique.
    </script>

    <script type="text/markdown" data-manual="gandivisorsantander" data-title="Divisor Santander">
# Divisor Santander

Percorre um lote de PDFs de processo e separa, em cada um, as páginas da Inicial das demais, baixando os arquivos gerados. Entram PDFs nomeados com o CNJ; saem `Inicial`, `Docs Inicial` ou divisões com nome próprio, todos baixados direto para a pasta de downloads do navegador.

## Requisitos

- `pdf.js` (`../../vendor/pdfjs/pdf.min.js`, com worker em `../../vendor/pdfjs/pdf.worker.min.js`) para exibir as páginas e ler o texto, e `pdf-lib` (`../../vendor/pdf-lib/pdf-lib.min.js`) para copiar as páginas.
- Seleção múltipla de arquivos `.pdf`, feita pelo seletor do navegador; os arquivos ficam abertos um a um, não em paralelo.
- O CNJ é procurado no nome do arquivo, no padrão `0000000-00.0000.0.00.0000` ou como 20 dígitos seguidos. Quando não é encontrado, o toy pede o número e avisa que ele serve para nomear os arquivos gerados.
- Os downloads usam o mecanismo do próprio navegador. Não há ZIP, não há escolha de pasta e nada é enviado para a internet.

## Passo a passo

1. Clique em `Selecionar PDFs` e escolha os arquivos do lote. O texto de apoio lembra: `Use Ctrl+Clique para selecionar vários arquivos.`
2. O painel do lote mostra `Total`, `Processados`, `Faltando`, `Em andamento` e `Arquivo atual`, e o primeiro PDF é aberto no visualizador com a notificação `Arquivo carregado`.
3. Confira o painel `CNJ`. Se aparecer `Não detectado`, digite o número no campo com o exemplo `57104727520258090051 ou formatado` e clique em `Aplicar`.
4. Escolha o `Modo de divisão`: `Automático` ou `Personalizado`.
5. No modo `Automático`, navegue até a Inicial, ajuste `Primeira página` e `Última página` ou use os botões de marcação, confira o `Preview da divisão` e clique em `Dividir e baixar PDFs`.
6. No modo `Personalizado`, informe `Nome do arquivo`, `Início` e `Fim`, clique em `Adicionar divisão`, repita para cada corte e clique em `Processar todas as divisões`.
7. No modo `Automático`, o próximo arquivo do lote é aberto sozinho depois de cada divisão; o resumo final do lote aparece quando não há mais arquivos.

## Campos e controles

- **Selecionar PDFs** — abre o seletor múltiplo. Sem nenhum PDF: `Por favor, selecione arquivos PDF válidos.` Arquivos de outro tipo são descartados com o aviso `N arquivo(s) não-PDF foram ignorados.`
- **CNJ** — mostra o número detectado ou `Não detectado`.
- **Campo do CNJ manual** — aceita 20 dígitos, que são formatados automaticamente, ou o padrão já pontuado.
- **Aplicar** — valida e aplica o CNJ digitado, que passa a aparecer com a indicação `(manual)`.
- **Modo de divisão** — `Automático`, que gera `Inicial` e `Docs Inicial`, ou `Personalizado`, que cria vários cortes com nome próprio. Os painéis e os botões de ação trocam conforme a escolha.
- **Primeira página** e **Última página** — números inteiros, mínimo 1, máximo igual ao total de páginas do arquivo; começam em 1 e no total. Se a primeira ficar maior que a última, as bordas ficam vermelhas e o preview para de atualizar.
- **Marcar atual como 1ª** e **Marcar atual como última** — copiam a página exibida para os respectivos campos.
- **Nome do arquivo** — obrigatório; não pode conter os caracteres `< > : " / \ | ? *`.
- **Início** e **Fim** do modo personalizado — inteiros dentro do documento; os botões ao lado copiam a página atual para cada campo.
- **Adicionar divisão** — valida o nome e o intervalo e acrescenta o item em `Divisões criadas`, numerado e com a contagem de páginas.
- **Buscar palavra no PDF...** — campo de busca; `Enter` ou o botão `Buscar` procuram a palavra em todas as páginas.
- **Navegação de página** — botões `Primeira página`, `Página anterior`, `Próxima página` e `Última página`, mais o campo numérico ao centro. Os botões das pontas ficam desabilitados quando a página atual é a primeira ou a última. A roda do mouse sobre o documento também troca de página.
- **Zoom** — botões `Reduzir zoom` e `Aumentar zoom` em passos de 0,25 sobre o valor inicial de 150%, com o percentual exibido ao lado.
- **Dividir e baixar PDFs** e **Processar todas as divisões** — durante o trabalho ficam desabilitados e passam a mostrar `Processando...`.
- **Limpar e recomeçar** — confirma com `Deseja limpar tudo e recomeçar?` e depois avisa `Tudo limpo! Selecione novos PDFs para começar.`
- **Limpar divisões** — remove todas as divisões criadas no modo personalizado.

## Resultado

- `Preview da divisão` com dois cartões: `Inicial`, com o intervalo, a contagem de páginas e o nome `<Inicial><sufixo>.pdf`; e `Docs Inicial`, com as páginas restantes ou `Nenhuma página` seguido de `(Todas as páginas estão na "Inicial")`.
- Downloads: `Inicial - <CNJ>.pdf` e, quando sobram páginas, `Docs Inicial - <CNJ>.pdf`. Sem CNJ o sufixo é omitido e os nomes saem como `Inicial.pdf` e `Docs Inicial.pdf`.
- No modo `Personalizado`, cada divisão gera `<Nome> - <CNJ>.pdf`.
- Bloco `Resultado` com `Arquivo N/M processado!`, a linha `N PDF(s) baixado(s) com sucesso!` e, no fim, `Carregando próximo arquivo...` ou `Todos os arquivos foram processados!`
- Ao terminar o lote, a tela troca pelo resumo `Processamento concluído!` com `Total de arquivos`, `Processados com sucesso`, `Erros` e `Ignorados`, seguido de `Os arquivos foram baixados para sua pasta Downloads.`
- O painel `Processando` mostra a barra e as etapas `Lendo arquivo...`, `Carregando PDF...`, `Criando "Inicial"...`, `Gerando arquivo "Inicial"...`, `Criando "Docs Inicial"...` e `Concluído!`
- Notificações no canto da tela: `Arquivo carregado`, `Iniciando Divisão`, `Processando Divisões`, `Divisões geradas` e `Lote concluído`.

## Avisos e limitações

- `Erro: A primeira página não pode ser maior que a última página!` — validação antes de dividir, no modo automático.
- `Erro ao carregar PDF!` com o nome do arquivo e a mensagem do erro — o arquivo é contado como erro e o próximo da fila é aberto.
- `Erro ao processar PDF!` seguido de `Deseja continuar com o próximo arquivo?` — o arquivo entra como erro e o lote só segue se a continuidade for confirmada.
- `Erro ao processar divisões!` — mesma ideia no modo personalizado, sem perguntar sobre o próximo arquivo.
- `Digite um nome para o arquivo!`, `A página inicial não pode ser maior que a final!`, `Páginas devem estar entre 1 e N!` e `O nome do arquivo contém caracteres inválidos!` — validações da divisão personalizada.
- `Nenhuma divisão criada!` seguido de `Crie ao menos uma divisão antes de processar.` — o processamento personalizado começa com a lista vazia.
- `Digite o número CNJ!`, `Número CNJ inválido! Deve ter 20 dígitos.` e `Formato CNJ inválido!` — validação do CNJ informado à mão.
- `Digite uma palavra para buscar!`, `Nenhum PDF carregado!`, `Palavra não encontrada no documento.` e `Faça uma busca primeiro!` — respostas da busca.
- Sem CNJ detectado e sem preenchimento manual, os arquivos saem como `Inicial.pdf` e `Docs Inicial.pdf`, sem identificação do processo.
- Todos os downloads vão para a pasta padrão do navegador, um arquivo por vez; repetições recebem o sufixo numérico do próprio navegador.
- No modo `Personalizado` com mais de um PDF no lote, ao concluir um arquivo a tela avisa `Carregando próximo arquivo...` e passa sozinha (cerca de 1 segundo depois) para o próximo PDF da fila. A lista de divisões é esvaziada a cada processamento, então os cortes precisam ser criados de novo para o arquivo seguinte.
- Nada marca arquivos como ignorados, então o contador `Ignorados` do resumo final fica em zero.
- As páginas fora do intervalo da Inicial são reunidas em um único arquivo, sem separar cada documento.

## Detalhes técnicos

- O CNJ é procurado primeiro no padrão pontuado de sete dígitos, dois dígitos, quatro dígitos, um dígito, dois dígitos e quatro dígitos; depois em uma sequência de 20 dígitos, que é reescrita no formato `NNNNNNN-DD.AAAA.J.TR.OOOO`.
- O visualizador começa em escala 1.5, com zoom em passos de 0,25 limitados entre 0.5 e 3; cada página é desenhada em canvas pelo `pdf.js`.
- A roda do mouse usa pausa de gesto de 120 ms, impulso de 400 por página e intervalo mínimo de 160 ms entre trocas, o que evita pular páginas em rodas com inércia.
- O arquivo é lido duas vezes: uma para o visualizador e outra na hora de cortar, garantindo bytes íntegros na cópia das páginas.
- O arquivo `Docs Inicial` recebe as páginas anteriores à Inicial e depois as posteriores, nessa ordem, com os índices originais.
- A busca monta o texto de cada página juntando os itens com espaço, guarda esse texto em cache por página e lista todas as páginas encontradas, posicionando o documento na primeira delas.
- Cada download é disparado isoladamente com uma pausa de meio segundo antes do próximo; no modo personalizado há ainda 200 ms de intervalo entre a geração de cada divisão.
- A página carrega apenas `scripts.js`; o arquivo `script.js` existe na pasta do toy mas não é referenciado pelo `index.html`.
    </script>

    <script type="text/markdown" data-manual="ganextratorvalores" data-title="Extrator de Valores">
# Extrator de Valores

Extrai o número de cada linha colada e o reescreve no padrão brasileiro, com vírgula decimal. Entra uma lista de valores em texto, um por linha; sai uma tabela com a coluna `Extraído` e a mesma lista pronta para copiar.

## Requisitos

- Apenas navegador. O toy não lê arquivos, não usa bibliotecas externas e não envia nada para a internet.
- Cole um valor por linha. Em linhas com campos separados por `|`, apenas o trecho antes da primeira barra é aproveitado.
- Linhas vazias ou só com espaços são ignoradas na contagem e no resultado.

## Passo a passo

1. Cole os valores na caixa `Dados`. O texto de apoio do bloco diz `Cole os dados, um por linha.` e o placeholder da caixa é `Cole os dados aqui...`.
2. Clique em `Processar`.
3. Confira a coluna `Extraído` no bloco `Resultado` e a contagem exibida acima da tabela.
4. Clique em `Copiar resultado` para levar a saída para a área de transferência, ou em `Limpar` para esvaziar a caixa e o resultado.

## Campos e controles

- **Dados** — caixa de texto sem corretor ortográfico, com o placeholder `Cole os dados aqui...`.
- **Processar** — lê o conteúdo atual da caixa, monta a tabela e mostra a contagem `<N> linhas processadas.` (no singular, `1 linha processada.`).
- **Copiar resultado** — copia apenas a coluna de saída, sem cabeçalho e sem repetir a entrada, em valores separados por tabulação. O rótulo muda para `Copiado` por cerca de 1,6 segundo e volta para `Copiar resultado`.
- **Limpar** — apaga o texto, esconde o bloco de resultado, limpa a tabela e a mensagem de erro e devolve o foco à caixa de texto.
- O bloco de ajustes acima da caixa `Dados` não aparece: este toy não declara nenhum campo de configuração.

## Resultado

- Contagem de linhas processadas acima da tabela.
- Tabela com uma única coluna, `Extraído`, com uma linha por valor de entrada na mesma ordem em que foi colado.
- Área de transferência com um valor por linha, em texto separado por tabulação, sem cabeçalho.

## Avisos e limitações

- Linha sem nenhum dígito não gera aviso: a célula correspondente sai vazia.
- Não há mensagem de erro prevista para este modo; nenhuma entrada faz o toy recusar o processamento.
- O toy não soma, não arredonda e não interpreta moeda: ele apenas reescreve cada número.
- Valores ambíguos, escritos com ponto como separador de milhar e sem vírgula, são lidos como decimais: `1.234` sai como `1,234`.
- A saída é apenas a tela e a área de transferência; não há download nem gravação em arquivo.
- Processar de novo substitui todo o resultado anterior, inclusive o texto guardado para copiar.

## Detalhes técnicos

- Para cada linha, o toy pega o trecho antes do primeiro `|` e remove todos os caracteres que não sejam dígito, vírgula, ponto ou hífen.
- Quando o valor tem vírgula e ponto, a última ocorrência decide o formato: se a última vírgula vem depois do último ponto, os pontos são removidos e a vírgula vira ponto; caso contrário, as vírgulas são removidas. Em seguida todo ponto é trocado por vírgula, fixando a vírgula como separador decimal.
- Quando o valor tem apenas ponto, todo ponto vira vírgula. Assim `R$ 1.500,00` sai como `1500`, `2.499,90` sai como `2.499,90` e `1.234.567` sai como `1,234,567`.
- O sufixo `,00` é retirado do fim do resultado, o que transforma valores inteiros escritos com centavos em número simples.
- O hífen é preservado junto dos dígitos, então valores negativos continuam negativos.
- A cópia tenta a área de transferência do navegador e, quando ela é bloqueada, usa uma caixa de texto temporária com o comando de cópia para concluir a operação.
    </script>

    <script type="text/markdown" data-manual="ganjuntar" data-title="Juntar PDFs">
# Juntar PDFs

Une em um único PDF todos os PDFs de cada subpasta do diretório escolhido. Entra uma pasta com subpastas de PDFs; sai um arquivo `<nome da subpasta>.pdf` por subpasta, na raiz da pasta escolhida, além da lista de resultados na tela.

## Requisitos
- `pdf-lib` já vem no projeto (`vendor/pdf-lib/pdf-lib.min.js`); nenhum download é feito e nenhum arquivo é enviado para a internet.
- Para gravar o PDF gerado de volta na pasta escolhida é necessária a File System Access API (`showDirectoryPicker`), com permissão de leitura e escrita.
- Sem essa API, o toy usa o seletor clássico de pasta do navegador (input de diretório com `webkitdirectory`, `accept=".pdf,application/pdf"`) e o resultado sai apenas como link para abrir/baixar.
- Quando a página roda em `file:` dentro do iframe do app, a File System Access API é bloqueada pela permissions policy: nesse caso o seletor clássico é usado automaticamente.
- São considerados apenas arquivos cuja extensão termina em `.pdf` (sem diferenciar maiúsculas de minúsculas).

## Passo a passo
1. Clique em `Selecionar Pasta`.
2. Escolha a pasta que contém as subpastas com os PDFs. No modo com File System Access API o navegador pede permissão de leitura e escrita.
3. Confira o cartão que aparece: o nome da pasta, os contadores `Pastas` e `PDFs` e a lista `Subpastas` com a quantidade de PDFs de cada uma.
4. Clique em `Juntar PDFs`. O botão só fica habilitado quando existe pelo menos uma subpasta com PDFs.
5. Acompanhe a barra de progresso: ela mostra o nome da subpasta em processamento, o percentual e o detalhe `i/total - arquivo.pdf`.
6. Ao terminar, leia a seção `Resultados` e os PDFs abertos em novas abas.

## Campos e controles
- **Selecionar Pasta** — botão que abre o seletor de pasta. Depois da escolha, o próprio texto do botão passa a ser o nome da pasta e ele ganha o estado visual de selecionado.
- **Pastas** — contador de subpastas que contêm ao menos um PDF.
- **PDFs** — contador do total de PDFs encontrados nessas subpastas.
- **Subpastas** — lista de uma linha por subpasta, com o nome à esquerda e a quantidade de PDFs à direita.
- **Juntar PDFs** — inicia a união. Fica desabilitado antes de qualquer seleção, quando não há subpastas com PDFs e enquanto o processamento está em andamento.
- **Barra de progresso** — fica oculta até o processamento começar; em repouso exibe `-`, `0%` e `-`.

## Resultado
- Um arquivo `<nome da subpasta>.pdf` gravado na própria pasta escolhida, sobrescrevendo arquivo de mesmo nome quando já existe.
- No modo clássico (sem File System Access API), nenhum arquivo é gravado: o PDF montado é oferecido como link e aberto em nova aba.
- A seção `Resultados` lista um item por subpasta. Cada item mostra o nome do arquivo gerado, o rótulo `OK` e a quantidade de páginas no formato `N páginas`.
- Cada PDF gerado com sucesso é aberto automaticamente em uma nova aba.
- O caminho da pasta aparece acima dos contadores; no modo clássico ele vem com o sufixo `(modo offline)`.

## Avisos e limitações
- Se a seleção clássica não devolver nenhum PDF, aparece o aviso `Nenhum PDF encontrado na pasta selecionada.` e nada é processado.
- Arquivos cujo nome começa com `Integral_` são ignorados, tanto no modo com File System Access API quanto no modo clássico.
- Subpastas sem PDFs são descartadas da lista; no modo com File System Access API uma subpasta que não pode ser lida gera o aviso `Não foi possível ler subpasta: <nome>` no console e é pulada.
- Os PDFs precisam estar diretamente dentro das subpastas: o toy não desce mais de um nível. No modo clássico, arquivos soltos na raiz entram em um grupo com o nome da própria pasta escolhida e arquivos em níveis mais profundos são agrupados pela primeira subpasta do caminho.
- Um PDF que falha ao carregar é ignorado com o aviso `Erro ao processar <arquivo>:` no console; as páginas dos demais arquivos da mesma subpasta continuam sendo unidas.
- Se a subpasta inteira falhar, o item aparece com o rótulo `Falha` e a mensagem de erro do navegador na linha seguinte, sem interromper as outras subpastas.
- PDFs protegidos por senha são abertos com `ignoreEncryption: true`; se ainda assim não puderem ser lidos, valem as regras de falha acima.
- O toy não reordena, não rotaciona e não remove páginas: as páginas entram na ordem alfabética dos arquivos.
- Cancelar o seletor de pasta não faz nada e não mostra erro.

## Detalhes técnicos
- Os nomes de subpastas e de arquivos são ordenados com `localeCompare(..., 'pt-BR')`, tanto no modo com File System Access API quanto no clássico.
- Cada subpasta gera um `PDFDocument.create()`; cada arquivo é carregado com `PDFDocument.load(arrayBuffer, { ignoreEncryption: true })` e suas páginas são copiadas com `copyPages` e adicionadas com `addPage`.
- O progresso é calculado como `round(((subpastasProcessadas + (i + 1) / arquivosDaSubpasta) / totalDeSubpastas) * 100)`, com pausa de `10 ms` entre arquivos para a interface atualizar.
- A gravação usa `getFileHandle(fileName, { create: true })` seguido de `createWritable()`, `write(blob)` e `close()`; o blob é do tipo `application/pdf`.
- O nome de saída é exatamente `${nomeDaSubpasta}.pdf`, sem prefixo nem sufixo adicional.
    </script>

    <script type="text/markdown" data-manual="gannormalizadordocumentos" data-title="Normalizador CPF/CNPJ">
# Normalizador CPF/CNPJ

Recebe uma lista de documentos, um por linha, e devolve cada um no padrão oficial de CPF ou CNPJ, com o tipo identificado. Não grava arquivos: a saída fica na tela e na área de transferência.

## Requisitos
- Nenhuma dependência externa e nenhum download: o toy roda offline, dentro do próprio navegador.
- Para `Copiar resultado` é preciso que a área de transferência esteja disponível; quando a API do navegador falha, o toy usa a cópia por seleção temporária de texto.
- Os documentos não saem da máquina: todo o processamento é local.

## Passo a passo
1. Cole os documentos no campo `Dados`, um por linha.
2. Clique em `Processar`.
3. Confira a seção `Resultado`: o resumo com o número de linhas e a lista com o tipo e o valor normalizado de cada linha.
4. Clique em `Copiar resultado` para levar a coluna normalizada para onde precisar.
5. Clique em `Limpar` para esvaziar a entrada e esconder o resultado.

## Campos e controles
- **Dados** — área de texto livre, uma entrada por linha. Linhas em branco são descartadas, espaços no início e no fim de cada linha são ignorados e, em cada linha, só o trecho antes do primeiro `|` é considerado.
- **Processar** — aplica a normalização ao conteúdo atual do campo e exibe o resultado. Sempre disponível, inclusive com o campo vazio.
- **Copiar resultado** — copia apenas a coluna dos documentos normalizados, uma por linha, sem cabeçalho e sem a coluna de tipo. Depois da cópia o botão mostra `Copiado` por cerca de 1,6 segundo e volta ao texto `Copiar resultado`. Não faz nada enquanto não houver resultado.
- **Limpar** — esvazia `Dados`, esconde a seção `Resultado` e devolve o foco para o campo.

## Resultado
- A seção `Resultado` mostra o resumo `N linhas processadas.`, ou `1 linha processada.` quando há uma única linha.
- A lista tem duas colunas: `Tipo`, com `CPF`, `CNPJ` ou `INVÁLIDO`, e `Normalizado`, com o documento formatado.
- Exemplo de transformação:

```
entrada: 12345678901          -> Tipo: CPF       Normalizado: 123.456.789-01
entrada: 12.345.678/0001-95   -> Tipo: CNPJ      Normalizado: 12.345.678/0001-95
entrada: abc                  -> Tipo: INVÁLIDO  Normalizado: (vazio)
```

- O texto copiado por `Copiar resultado` contém somente a segunda coluna, uma linha por documento, separada por tabulação.
- O toy não cria nem altera arquivos ou pastas.

## Avisos e limitações
- Qualquer entrada cuja contagem de dígitos não seja 11 nem 14 recebe o rótulo `INVÁLIDO`, e a coluna `Normalizado` mostra os dígitos encontrados, que podem sair vazios quando a linha não tem nenhum dígito.
- Não há validação de dígito verificador: a decisão depende exclusivamente da quantidade de dígitos.
- Toda pontuação da entrada é descartada, não reaproveitada; a máscara é montada do zero a partir dos dígitos.
- Tudo o que vem depois do primeiro `|` na linha é ignorado.
- Este toy não produz mensagens de erro para o tipo de operação que executa; a área de aviso da tela só é usada por operações que retornam erro.
- Se uma linha tiver mais de 14 dígitos, por exemplo um CPF e um CNPJ colados, o resultado é `INVÁLIDO` com todos os dígitos.

## Detalhes técnicos
- As linhas são obtidas por `text.split(/\r?\n/)`, com `trim` em cada uma e descarte das vazias.
- Os dígitos saem de `line.split('|')[0].replace(/\D/g, '')`.
- Com 11 dígitos a máscara é `###.###.###-##`; com 14 dígitos, `##.###.###/####-##`; qualquer outro tamanho devolve os dígitos sem máscara.
- O pareamento entre entrada e saída é sempre posicional: cada linha de entrada gera exatamente uma linha de saída, na mesma ordem.
    </script>

    <script type="text/markdown" data-manual="gannormalizadornomes" data-title="Normalizador de Nomes">
# Normalizador de Nomes

Recebe textos de nomes, um por linha, e devolve cada valor em maiúsculas, sem acentos e limitado aos caracteres aceitos pelo cadastro. Não grava arquivos: a saída fica na tela e na área de transferência.

## Requisitos
- Nenhuma dependência externa e nenhum download: o toy roda offline, dentro do próprio navegador.
- Para `Copiar resultado` é preciso que a área de transferência esteja disponível; quando a API do navegador falha, o toy usa a cópia por seleção temporária de texto.
- Suporta colunas separadas por tabulação, o que permite colar direto de uma planilha.

## Passo a passo
1. Cole os nomes no campo `Dados`, um por linha. Para várias colunas, cole com tabulação entre elas, como vem de uma planilha.
2. Clique em `Processar`.
3. Confira a seção `Resultado`: o resumo com o número de linhas e a lista de valores já normalizados.
4. Clique em `Copiar resultado` para levar a saída para onde precisar.
5. Clique em `Limpar` para esvaziar a entrada e esconder o resultado.

## Campos e controles
- **Dados** — área de texto livre, uma entrada por linha. Linhas em branco são descartadas. Cada linha é dividida por tabulação, e cada célula é normalizada de forma independente.
- **Processar** — aplica a normalização ao conteúdo atual do campo e exibe o resultado. Sempre disponível, inclusive com o campo vazio.
- **Copiar resultado** — copia todas as colunas normalizadas, uma linha por linha, com as colunas separadas por tabulação, sem cabeçalho. Depois da cópia o botão mostra `Copiado` por cerca de 1,6 segundo e volta ao texto `Copiar resultado`. Não faz nada enquanto não houver resultado.
- **Limpar** — esvazia `Dados`, esconde a seção `Resultado` e devolve o foco para o campo.

## Resultado
- A seção `Resultado` mostra o resumo `N linhas processadas.`, ou `1 linha processada.` quando há uma única linha.
- Com uma coluna, a lista tem o cabeçalho `Normalizado`. Com mais de uma, os cabeçalhos são `Normalizado 1`, `Normalizado 2` e assim por diante, na ordem das colunas de entrada.
- As colunas são preservadas na mesma ordem e todas as linhas são completadas com valor vazio até o número de colunas da linha mais larga do lote.
- Exemplo de transformação:

```
entrada: João da Silva|123     -> saída: JOAO DA SILVA
entrada: MARIA;SILVA           -> saída: MARIA;SILVA
entrada: José  Carlos          -> saída: JOSE  CARLOS
entrada: sem oab                -> saída: 0
```

- O texto copiado por `Copiar resultado` contém todas as colunas, sem cabeçalho, com tabulação entre as colunas.
- O toy não cria nem altera arquivos ou pastas.

## Avisos e limitações
- O que é corrigido: acentuação e cedilha são removidas, o texto vira maiúsculo, espaços no início e no fim da célula são removidos, e três marcadores internos são traduzidos depois da normalização: `SEM ADV` vira `SEM ADVOGADO`, `SEM OAB` vira `0` e `SEM UF` vira `TJ`.
- O que é removido: todo caractere fora das letras sem acento, dos dígitos, do espaço, do sublinhado, do hífen e do ponto e vírgula. Isso inclui pontos, vírgulas, barras, parênteses, aspas, arrobas e sinais como `&`.
- O que é preservado: dígitos, sublinhado, hífen, ponto e vírgula e os espaços internos, inclusive quando há mais de um espaço seguido entre as palavras.
- O trecho depois do primeiro `|` é descartado na célula, mesmo quando contém informação útil.
- As traduções de `SEM ADV`, `SEM OAB` e `SEM UF` só valem quando a célula inteira, já normalizada, é exatamente esse texto; sozinhas ou em outra posição elas não são alteradas.
- Células vazias continuam vazias, inclusive as criadas para completar linhas com menos colunas.
- Este toy não produz mensagens de erro para o tipo de operação que executa; a área de aviso da tela só é usada por operações que retornam erro.
- O pareamento é posicional: cada linha de entrada gera exatamente uma linha de saída, na mesma ordem.

## Detalhes técnicos
- As linhas vêm de `text.split(/\r?\n/)`, mantendo somente as que têm conteúdo após remover espaços; as células vêm de `line.split('\t')`.
- A normalização de cada célula usa decomposição NFKD e remoção de tudo o que não seja letra sem acento, dígito, espaço, sublinhado, hífen ou ponto e vírgula, seguida de conversão para maiúsculas e remoção de espaços nas pontas.
- Cabeçalhos: uma única coluna gera `Normalizado`; mais de uma gera `Normalizado N`, começando em `Normalizado 1`.
    </script>

    <script type="text/markdown" data-manual="gannormalizadoriris" data-title="Normalizador de Pastas IRIS">
# Normalizador de Pastas IRIS

Recebe uma lista de identificadores de pastas IRIS, um por linha, e devolve cada valor sem o prefixo `IRIS` e sem zeros à esquerda. Não toca em arquivos nem em pastas do disco: a saída fica na tela e na área de transferência.

## Requisitos
- Nenhuma dependência externa e nenhum download: o toy roda offline, dentro do próprio navegador.
- Para `Copiar resultado` é preciso que a área de transferência esteja disponível; quando a API do navegador falha, o toy usa a cópia por seleção temporária de texto.
- Nenhuma permissão de pasta é pedida: o toy não lê nem grava no sistema de arquivos.

## Passo a passo
1. Cole os identificadores no campo `Dados`, um por linha, no formato mostrado na dica da tela: `IRIS00998585`.
2. Clique em `Processar`.
3. Confira a seção `Resultado`: o resumo com o número de linhas e a lista com o valor normalizado de cada linha.
4. Clique em `Copiar resultado` para levar a lista normalizada para onde precisar.
5. Clique em `Limpar` para esvaziar a entrada e esconder o resultado.

## Campos e controles
- **Dados** — área de texto livre, uma entrada por linha. Linhas em branco são descartadas e espaços no início e no fim de cada linha são ignorados. Não há campo de configuração nesta ferramenta.
- **Processar** — aplica a normalização ao conteúdo atual do campo e exibe o resultado. Sempre disponível, inclusive com o campo vazio.
- **Copiar resultado** — copia a coluna normalizada, uma linha por linha, sem cabeçalho. Depois da cópia o botão mostra `Copiado` por cerca de 1,6 segundo e volta ao texto `Copiar resultado`. Não faz nada enquanto não houver resultado.
- **Limpar** — esvazia `Dados`, esconde a seção `Resultado` e devolve o foco para o campo.

## Resultado
- A seção `Resultado` mostra o resumo `N linhas processadas.`, ou `1 linha processada.` quando há uma única linha.
- A lista tem uma única coluna, com o cabeçalho `Normalizado`.
- Exemplo de transformação:

```
entrada: IRIS00998585   -> saída: 998585
entrada: iris-000123    -> saída: 123
entrada: IRIS 0025      -> saída: 25
entrada: IRIS000        -> saída: 0
entrada: 000123         -> saída: 123
```

- O texto copiado por `Copiar resultado` tem uma linha por entrada, sem cabeçalho.
- O pareamento é posicional: cada linha de entrada gera exatamente uma linha de saída, na mesma ordem.
- O toy não cria, renomeia nem move arquivos ou pastas.

## Avisos e limitações
- O prefixo é removido apenas no início do valor, sem diferenciar maiúsculas de minúsculas e aceitando, no máximo, um separador opcional entre o prefixo e o número, entre `-`, `_`, `:` e `/`, com espaços ao redor permitidos.
- Quando o prefixo aparece repetido, só a primeira ocorrência é removida: `IRISIRIS001` sai como `IRIS001`.
- Os zeros à esquerda são removidos apenas enquanto houver um dígito depois deles. Um valor só de zeros, como `IRIS000`, sai como `0`.
- Zeros no meio do valor são preservados: `IRIS1000` sai como `1000`.
- O restante do texto não é alterado: maiúsculas e minúsculas são mantidas e nenhuma pontuação interna é removida. `IRIS PASTA 01` sai como `PASTA 01`.
- Valores sem o prefixo `IRIS` passam pelo mesmo tratamento: só os zeros à esquerda são removidos, como em `000123`, que sai como `123`.
- Como o toy só produz texto, renomear pastas ou arquivos depende de você aplicar a lista no gerenciador de arquivos ou em outro processo.
- Este toy não produz mensagens de erro para o tipo de operação que executa; a área de aviso da tela só é usada por operações que retornam erro.

## Detalhes técnicos
- As linhas vêm de `text.split(/\r?\n/)`, com `trim` em cada uma e descarte das vazias.
- O prefixo é removido com a expressão `^iris\s*[-_:/]?\s*`, aplicada sem diferenciar maiúsculas de minúsculas.
- Os zeros à esquerda são removidos com a expressão `^0+(?=\d)`, que exige um dígito logo depois dos zeros removidos.
- O cabeçalho da saída é sempre `Normalizado`, uma coluna por linha.
    </script>

    <script type="text/markdown" data-manual="ganpadronizadorcnj" data-title="Padronizador CNJ">
# Padronizador CNJ

Converte uma lista de números de processo entre o formato pontuado e o formato despontuado. A entrada é uma lista de processos, um por linha; a saída é a mesma lista no formato escolhido, com cada linha marcada como convertida ou inválida.

## Requisitos
- Navegador com JavaScript habilitado. Todo o processamento acontece na página.
- Nenhum arquivo é lido ou gravado, e nada é enviado para a internet.
- O botão de cópia usa a área de transferência do navegador.

## Passo a passo
1. Cole os processos no campo `Lista de processos`, um por linha.
2. Escolha o `Modo`: `Pontuar` (opção marcada por padrão) ou `Despontuar`.
3. Clique em `Processar Lista`.
4. Confira a lista de resultados: cada item mostra o valor final, o selo `OK` ou `Inválido`, a linha `Original: ...` e a mensagem da conversão.
5. Clique em `Copiar para a Memória` para levar todas as linhas de saída para a área de transferência, na ordem da entrada.

## Campos e controles
- **Lista de processos** — área de texto livre, um processo por linha. O campo mostra como exemplo `00000018920238260100` e `0000002-90.2024.8.26.0100`. Linhas vazias ou só com espaços são descartadas; espaços no início e no fim de cada linha são removidos antes da conversão.
- **Modo** — grupo de opções com `Pontuar` e `Despontuar`. Só a opção marcada é usada; `Pontuar` já vem selecionada.
- **Processar Lista** — reprocessa todo o conteúdo atual do campo. Rodar de novo substitui o resultado anterior.
- **Copiar para a Memória** — copia uma linha de texto por item. Fica desabilitado quando não há nenhum item com conteúdo. Depois de copiar, o rótulo vira `Copiado` e volta a `Copiar para a Memória` após 1,6 segundo; se a cópia falhar, mostra `Falha ao copiar` pelo mesmo intervalo.

## Resultado
- Resumo no topo da seção: `N de M linhas convertidas.`, contando apenas as linhas aceitas.
- Quando nenhuma linha tem conteúdo, a seção mostra `Nenhuma linha para processar.` e a mensagem `Nenhuma linha válida informada.`, e o botão de cópia fica desabilitado.
- Cada item da lista exibe o valor convertido, o selo `OK` ou `Inválido`, a linha iniciada por `Original: ` seguida do texto digitado, e a mensagem `Convertido para formato pontuado.` ou `Convertido para formato despontuado.`; nas linhas recusadas a mensagem de erro aparece destacada.
- A cópia gera as linhas de saída na ordem da entrada. As linhas recusadas entram sem alteração, exatamente como foram digitadas (já sem os espaços das pontas).
- O toy não cria arquivos nem pastas; a saída é apenas a lista na tela e o texto copiado.

## Avisos e limitações
- Linha cuja quantidade de dígitos não é exatamente 20 é recusada com `Linha inválida: o CNJ precisa ter 20 dígitos.` e recebe o selo `Inválido`; ela continua aparecendo na saída, sem conversão.
- Não há validação de dígito verificador: a única checagem é a contagem de dígitos. Um número com 20 dígitos e dígito verificador errado é aceito normalmente.
- Letras e qualquer outro caractere que não seja dígito são descartados antes da contagem, então uma linha com texto extra pode ser aceita se sobrarem 20 dígitos.

## Detalhes técnicos
- O texto é dividido por quebras de linha (`\r?\n`); cada linha é aparada e as vazias são ignoradas.
- Todos os caracteres que não são dígitos são removidos da linha antes da checagem e da conversão.
- No modo `Pontuar`, os 20 dígitos são recortados por posição e remontados no formato `NNNNNNN-DD.AAAA.J.TR.OOOO`: posições 1 a 7 número sequencial, 8 a 9 dígito verificador, 10 a 13 ano, 14 segmento da justiça, 15 a 16 tribunal e 17 a 20 origem. Não há recálculo de dígito verificador.
- No modo `Despontuar`, a saída é a sequência dos 20 dígitos, sem separadores.
    </script>

    <script type="text/markdown" data-manual="ganremovedorsufixouf" data-title="Removedor por Wildcard">
# Removedor por Wildcard

Remove ou substitui trechos de cada linha usando um padrão wildcard. A entrada é uma lista de textos, um por linha; a saída é uma tabela com a linha original e a linha resultante.

## Requisitos
- Navegador com JavaScript habilitado. Nada é enviado para a internet e nenhum arquivo é lido ou gravado.
- A cópia usa a área de transferência do navegador, com alternativa interna quando o navegador bloqueia o acesso direto.

## Passo a passo
1. Cole os dados no campo `Dados`, um item por linha.
2. Confira o `Modo`: `Remover` (padrão) ou `Substituir`.
3. Ajuste o `Padrão (aceita * e ?)` — o valor inicial é `-*`.
4. No modo `Substituir`, preencha `Substituir por` com o texto que entra no lugar de cada trecho encontrado.
5. Clique em `Processar`.
6. Use `Copiar resultado` para copiar a tabela em TSV, ou `Limpar` para zerar a entrada, voltar os campos aos valores iniciais e esconder o resultado.

## Campos e controles
- **Dados** — área de texto livre. O exemplo do campo é `Cole os dados aqui...`. Cada linha é aparada e as linhas vazias são descartadas.
- **Modo** — `Remover` apaga todos os trechos que casam com o padrão; `Substituir` troca cada trecho casado pelo conteúdo de `Substituir por`.
- **Padrão (aceita * e ?)** — `*` representa qualquer sequência (inclusive vazia) e `?` representa exatamente um caractere. Parênteses agrupam o padrão e são repassados para a expressão regular. Valor inicial `-*`, que apaga do primeiro hífen até o fim da linha. Fica sempre habilitado, inclusive no modo `Remover`.
- **Substituir por** — só aparece quando o `Modo` é `Substituir`. Começa vazio, o que faz o trecho casado ser apagado. É ocultado novamente ao voltar para `Remover`.
- **Processar** — aplica o padrão ao conteúdo atual do campo.
- **Limpar** — esvazia `Dados`, restaura `Modo` para `Remover` e o padrão para `-*`, limpa os resultados e devolve o foco ao campo `Dados`.
- **Copiar resultado** — copia as linhas da tabela em TSV, sem cabeçalho e com as duas colunas. Fica sem efeito enquanto não houver resultado.

## Resultado
- Resumo `N linhas processadas.` — no singular, `1 linha processada.`.
- Tabela com a coluna `Original` e uma segunda coluna que muda com o modo: `Sem trecho` em `Remover` e `Substituído` em `Substituir`.
- Linhas em que o padrão não casa aparecem com o mesmo texto nas duas colunas.
- A cópia gera uma linha por item, com as colunas separadas por tabulação.
- O toy não cria arquivos nem pastas.

## Avisos e limitações
- Com o campo de padrão vazio, o processamento é interrompido com `Informe um padrão.` e nenhuma tabela é montada.
- Padrão que não pode ser compilado, por exemplo com parênteses desbalanceados, gera `O padrão informado não pôde ser processado.`
- A comparação diferencia maiúsculas de minúsculas.
- Não há retrorreferência: os parênteses agrupam, mas não existe sintaxe para repetir o grupo capturado na saída.
- O mesmo padrão é aplicado a todas as ocorrências da linha, não só à primeira.

## Detalhes técnicos
- Conversão do padrão para expressão regular: `*` vira `.*`, cada `?` vira `.`, os parênteses são mantidos como delimitadores de grupo e todos os demais caracteres são escapados. A expressão é criada com a flag `g` (todas as ocorrências) e sem a flag `i` (sensível a maiúsculas).
- O texto de `Substituir por` é passado direto para a substituição nativa do navegador, então sequências como `$&` e `$1` são interpretadas ali, não escritas literalmente.
- Exemplos de padrão: `-*` transforma `123-PI` em `123`; `-?` transforma `1234-PI` em `1234I`, porque apaga o hífen e o caractere seguinte; `-PI` apaga apenas as ocorrências de `-PI`; `*.pdf` apaga a linha inteira quando ela termina em `.pdf`, porque `*` é guloso.
- Cada `?` vale um caractere isolado: o padrão `-??` só casa onde houver hífen, um caractere, outro hífen e mais um caractere (como em `A-B-1`).
- A substituição é global: `A-1-B-2` com o padrão `-*` vira `A`.
    </script>

    <script type="text/markdown" data-manual="ganrenomeador" data-title="Renomeador em Massa">
# Renomeador em Massa

Renomeia arquivos de uma pasta local aplicando um padrão wildcard com substituição. A entrada é uma pasta escolhida pelo usuário; a saída é a lista de nomes novos e um relatório por arquivo, depois que a renomeação é confirmada.

## Requisitos
- Navegador compatível com a File System Access API (Chromium e derivados). O seletor de pasta é aberto pelo aplicativo que hospeda o toy.
- A pasta é aberta com permissão de leitura e escrita; a permissão é pedida no momento da seleção.
- Nenhum conteúdo de arquivo é lido: o toy trabalha apenas com os nomes dentro da pasta escolhida. Nada é enviado para a internet.

## Passo a passo
1. Clique em `Selecionar pasta` e escolha a pasta dos arquivos. O texto `Nenhuma pasta selecionada` é substituído pelo nome da pasta.
2. Escolha um `Preset` ou preencha à mão o `Padrão a encontrar (aceita * e ?)`.
3. Preencha `Substituir por` com o texto de destino, usando `$1`, `$2` e assim por diante para reinserir os curingas.
4. Marque `Normalizar extensão (letras maiúsculas para minúsculas)` e `Incluir subpastas` conforme a necessidade.
5. Clique em `Visualizar`. A seção `Prévia da renomeação` lista cada arquivo afetado no formato `nome atual → novo nome`.
6. Confira a prévia e clique em `Renomear`. O relatório final mostra uma linha por arquivo, começando por `RENOMEADO` ou `ERRO`.

## Campos e controles
- **Pasta dos arquivos** / **Selecionar pasta** — abre o seletor de pasta em modo leitura e escrita. Cancelar o seletor não altera nada e não mostra erro.
- **Preset** — `Personalizado` (sem preset) mais três combinações prontas: `Integral → Integral_`, que usa o padrão `Integral - *.pdf` com substituição `Integral_$1.pdf`; `Inicial → Inicial_`, com `Inicial - *.pdf` e `Inicial_$1.pdf`; e `Docs Inicial → Docs_`, com `Docs Inicial - *.pdf` e `Docs_$1.pdf`.
- **Padrão a encontrar (aceita * e ?)** — `*` casa com qualquer sequência e `?` com um caractere. Exemplo do campo: `Ex.: Integral - *.pdf`. Cada `*` conta como um curinga e cada sequência de `?` conta como um único curinga, na ordem em que aparecem.
- **Substituir por** — texto que entra no lugar do que casou. Exemplo do campo: `Ex.: Integra_$1.pdf`. Deixar vazio apaga o trecho casado. Para usar a substituição é preciso ter um padrão preenchido.
- **Normalizar extensão (letras maiúsculas para minúsculas)** — depois da substituição, reescreve a extensão do nome final em minúsculas. Não afeta arquivos cujo nome não casa com o padrão.
- **Incluir subpastas** — marcado, varre a pasta escolhida e todas as subpastas recursivamente; desmarcado, olha só os arquivos do nível raiz.
- **Visualizar** — fica desabilitado enquanto não houver pasta selecionada e padrão não vazio. Gera o plano de renomeação e o guarda para a etapa seguinte.
- **Renomear** — fica desabilitado enquanto não existir uma prévia com pelo menos um arquivo a renomear, e é desabilitado junto com `Visualizar` durante a execução.
- Alterar o padrão, a substituição, qualquer uma das duas caixas de seleção, o preset ou a pasta descarta a prévia anterior e volta a exigir `Visualizar`.

## Resultado
- Título da prévia: `Prévia da renomeação — N arquivo(s) de TOTAL`, em que `N` é a quantidade de arquivos que mudam de nome e `TOTAL` é a quantidade de arquivos varridos.
- Cada linha da prévia mostra o caminho relativo do arquivo (com as subpastas, quando houver) e o novo nome.
- Sumário com os contadores `Arquivos`, `A renomear` e `Erros`, atualizado depois da renomeação.
- `Relatório da operação` com uma linha por arquivo processado: `RENOMEADO` seguido de `caminho → novo nome`, ou `ERRO` seguido de `caminho: motivo`.
- O toy não cria nem apaga arquivos e não gera arquivos de relatório: ele apenas troca os nomes dentro da pasta escolhida, e o relatório existe só na tela.

## Avisos e limitações
- Falha ao montar a prévia abre um alerta começando por `Não foi possível gerar a prévia: ` seguido do motivo; falha ao renomear abre um alerta começando por `Não foi possível renomear os arquivos: `.
- Se a pasta guardada não estiver mais acessível, a prévia falha com `A pasta selecionada não está mais disponível. Selecione-a novamente.`
- Se o plano tiver sido descartado, a renomeação falha com `A prévia expirou. Gere uma nova prévia antes de renomear.`
- Arquivo cujo nome de destino já existe na mesma pasta falha com `já existe um arquivo com esse nome`; os demais arquivos do plano continuam sendo processados.
- Conflitos não são avisados na prévia: se dois arquivos apontarem para o mesmo nome novo, o primeiro é renomeado e o segundo falha na execução.
- Sem resposta do aplicativo hospedeiro, a operação é encerrada com `A operação de renomeação não respondeu.` após 120 segundos, e a seleção de pasta com `A seleção de pasta não respondeu.` após 60 segundos.
- Não existe desfazer: depois de renomear, o plano é descartado e não há como voltar aos nomes anteriores.
- Arquivos cujo nome não casa com o padrão não entram na prévia e nunca são renomeados, mesmo com `Normalizar extensão` marcado.
- A busca percorre todos os arquivos da pasta, inclusive os ocultos, sem filtro de extensão.

## Detalhes técnicos
- Conversão do padrão: `*` vira um grupo `(.*)` e cada sequência de `?` vira um grupo `(.{n})`, em que `n` é a quantidade de `?` seguidos; os demais caracteres são escapados. A expressão é compilada sem distinção entre maiúsculas e minúsculas.
- A expressão não é global, então apenas a primeira ocorrência do padrão no nome é substituída.
- `$1`, `$2` e assim por diante correspondem, na ordem, aos curingas do padrão.
- A substituição é aplicada ao nome do arquivo, nunca ao caminho; o caminho só é usado para exibir a linha da prévia.
- Arquivos cujo nome final ficaria igual ao atual são omitidos da prévia.
- Normalização de extensão: o trecho após o último ponto é reescrito em minúsculas; nomes sem ponto ou terminados em ponto ficam intactos, e extensões que já estão em minúsculas não são tocadas.
    </script>

    <script type="text/markdown" data-manual="ganresolvercarteirareu" data-title="Resolver Carteira/Réu">
# Resolver Carteira/Réu

Encontra o réu correspondente a uma carteira, cliente ou apelido informado. A entrada é uma lista de consultas, uma por linha; a saída é uma tabela com a consulta, a carteira encontrada e o réu correspondente.

## Requisitos
- Navegador com JavaScript habilitado. A tabela de carteiras e réus vem embutida no próprio toy; nada é enviado para a internet e nenhum arquivo é lido.
- A cópia usa a área de transferência do navegador, com alternativa interna quando o acesso direto é bloqueado.

## Passo a passo
1. Cole as consultas no campo `Dados`, uma por linha. Cada linha pode ser o nome da carteira, o nome do réu, um apelido curto ou um trecho do nome.
2. Clique em `Processar`.
3. Confira a tabela: a coluna `Consulta` repete o que você digitou, e as colunas `Carteira` e `Réu` mostram o que foi encontrado.
4. Clique em `Copiar resultado` para levar a saída para a área de transferência, ou `Limpar` para esvaziar o campo e esconder o resultado.

## Campos e controles
- **Dados** — área de texto livre, uma consulta por linha. O exemplo do campo é `Cole os dados aqui...`. Cada linha é aparada e as linhas vazias são descartadas. Esta ferramenta não tem campos de configuração: só o campo de dados e os botões.
- **Processar** — resolve todas as linhas do campo. Rodar de novo substitui o resultado anterior.
- **Limpar** — esvazia `Dados`, limpa a tabela e a mensagem de erro e devolve o foco ao campo.
- **Copiar resultado** — copia a saída em TSV, sem cabeçalho e sem a coluna `Consulta`, ou seja, apenas os pares de carteira e réu, na ordem das linhas. Não faz nada enquanto não houver resultado.

## Resultado
- Resumo `N linhas processadas.` — no singular, `1 linha processada.`
- Tabela com as colunas `Consulta`, `Carteira` e `Réu`, uma linha por consulta, na mesma ordem da entrada.
- Consulta que não encontra nada aparece com `Carteira` e `Réu` vazios, sem mensagem de erro e sem destaque de falha.
- A cópia gera uma linha por consulta com dois campos separados por tabulação, pronta para colar em planilha.
- O toy não grava arquivos nem pastas e não guarda nada no navegador: além da tabela na tela, a única saída é o texto copiado para a área de transferência.

## Avisos e limitações
- A ferramenta não emite mensagens de erro próprias: entrada não reconhecida simplesmente devolve células vazias.
- A correspondência é heurística, por apelido exato, nome do réu contido na consulta e semelhança de palavras. Consultas parecidas podem cair na carteira errada.
- Várias empresas compartilham a mesma carteira: `Saneamento - BRK` e `Mercado Livre` aparecem repetidas na tabela interna, e um apelido genérico devolve a primeira entrada listada para aquele nome.
- Acentos, pontuação e sinais são descartados na comparação, com exceção do `+`, que é preservado.
- A comparação não diferencia maiúsculas de minúsculas.
- Empates de pontuação são resolvidos pela ordem da tabela interna, não por proximidade do texto digitado.

## Detalhes técnicos
- Normalização das consultas: decomposição de acentos (NFKD), troca de todo caractere que não seja letra, dígito ou `+` por espaço, espaços repetidos colapsados, texto em maiúsculas e sem espaços nas pontas.
- Passo 1: apelido exato. A consulta normalizada é procurada numa tabela fixa de apelidos, como `ml`, `ml vc` e `vc` para `Mercado Livre - Mercado Livre - JC`/`REU A DEFINIR`, `mljec`, `jec` e `cejusc` para `Mercado Livre - Mercado Livre - JEC`/`REU A DEFINIR`, `prolagos`, `prolagos consumidor`, `prolagos cobranca`, `brk` e variantes como `brk recife`, `brk goias`, `brk sumare`, `saneatins`, `mercado pago`, `mercado envios`, `mercado credito`, `ebazar`, `ibazar`, `kangu`, `k21`, `naturgy`, `ceg`, `gas natural` e `bradesco`.
- Passo 2: nome do réu contido na consulta. Se a consulta normalizada contiver o nome normalizado de algum réu da tabela, vale a primeira entrada nessa ordem.
- Passo 3: pontuação por semelhança. São testadas três variantes da consulta: a normalizada, a normalizada sem espaços e a normalizada com um espaço inserido entre letra e dígito. Cada entrada da tabela recebe a maior pontuação entre as variantes: igualdade exata com o nome da carteira ou do réu vale 10000; carteira e réu concatenados contendo a variante vale 5000 mais o comprimento da variante; caso contrário, 100 para cada palavra com mais de um caractere em comum.
- A maior pontuação vence, e a comparação é estrita, então a primeira entrada da tabela com a pontuação máxima fica com o resultado. Consulta que não soma nenhum ponto volta sem carteira e sem réu.
- Linha vazia depois da normalização é devolvida em branco sem passar pelos passos de busca.
    </script>
<!-- manuals:end -->

    <script>
        (function () {
            'use strict';

            var grid = document.getElementById('manualGrid');
            var overlay = document.getElementById('manualOverlay');
            var nav = document.getElementById('manualNav');
            var titleEl = document.getElementById('manualTitle');
            var contentEl = document.getElementById('manualContent');
            var closeBtn = document.getElementById('manualClose');
            var lastFocus = null;

            if (!grid || !overlay || !nav || !titleEl || !contentEl || !closeBtn) return;

            // ---------------------------------------------------------------
            // Markdown: subconjunto usado nos manuais (títulos, parágrafos,
            // listas planas, negrito, código, blocos cercados, citação e régua).
            // O texto é escapado antes de virar HTML.
            // ---------------------------------------------------------------

            function escapar(texto) {
                return String(texto)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function aplicarInline(texto) {
                var pedacos = [];
                var guardado = String(texto).replace(/`([^`]+)`/g, function (todo, codigo) {
                    pedacos.push('<code>' + escapar(codigo) + '</code>');
                    return '\u0000' + (pedacos.length - 1) + '\u0000';
                });

                guardado = escapar(guardado)
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (todo, rotulo, href) {
                        return '<a href="' + escapar(href) + '">' + rotulo + '</a>';
                    });

                // O \u0000 é o marcador interno dos trechos de código já convertidos.
                // eslint-disable-next-line no-control-regex
                return guardado.replace(/\u0000(\d+)\u0000/g, function (todo, indice) {
                    return pedacos[Number(indice)];
                });
            }

            var LINHA_ESPECIAL = /^\s*(?:#{1,4}\s|>|[-*+]\s|\d+[.)]\s|```|---|\*\*\*|___)/;

            function renderizar(markdown) {
                var linhas = String(markdown).replace(/\r\n?/g, '\n').split('\n');
                var saida = [];
                var listaAberta = null;
                var i = 0;

                function fecharLista() {
                    if (!listaAberta) return;
                    saida.push(listaAberta === 'ul' ? '</ul>' : '</ol>');
                    listaAberta = null;
                }

                while (i < linhas.length) {
                    var linha = linhas[i];

                    if (/^\s*$/.test(linha)) { fecharLista(); i += 1; continue; }

                    if (/^\s*```/.test(linha)) {
                        fecharLista();
                        var bloco = [];
                        i += 1;
                        while (i < linhas.length && !/^\s*```/.test(linhas[i])) { bloco.push(linhas[i]); i += 1; }
                        i += 1;
                        saida.push('<pre><code>' + escapar(bloco.join('\n')) + '</code></pre>');
                        continue;
                    }

                    var titulo = linha.match(/^(#{1,4})\s+(.*?)\s*$/);
                    if (titulo) {
                        fecharLista();
                        var nivel = titulo[1].length;
                        saida.push('<h' + nivel + '>' + aplicarInline(titulo[2]) + '</h' + nivel + '>');
                        i += 1;
                        continue;
                    }

                    if (/^\s*(?:---|\*\*\*|___)\s*$/.test(linha)) {
                        fecharLista();
                        saida.push('<hr>');
                        i += 1;
                        continue;
                    }

                    if (/^\s*>\s?/.test(linha)) {
                        fecharLista();
                        var citacao = [];
                        while (i < linhas.length && /^\s*>\s?/.test(linhas[i])) {
                            citacao.push(linhas[i].replace(/^\s*>\s?/, ''));
                            i += 1;
                        }
                        saida.push('<blockquote><p>' + aplicarInline(citacao.join(' ')) + '</p></blockquote>');
                        continue;
                    }

                    var item = linha.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
                    if (item) {
                        var tipo = /^\s*\d/.test(linha) ? 'ol' : 'ul';
                        if (listaAberta !== tipo) { fecharLista(); saida.push(tipo === 'ol' ? '<ol>' : '<ul>'); listaAberta = tipo; }
                        saida.push('<li>' + aplicarInline(item[1]) + '</li>');
                        i += 1;
                        continue;
                    }

                    fecharLista();
                    var paragrafo = [linha];
                    i += 1;
                    while (i < linhas.length && !/^\s*$/.test(linhas[i]) && !LINHA_ESPECIAL.test(linhas[i])) {
                        paragrafo.push(linhas[i]);
                        i += 1;
                    }
                    saida.push('<p>' + aplicarInline(paragrafo.join(' ')) + '</p>');
                }

                fecharLista();
                return saida.join('\n');
            }

            // ---------------------------------------------------------------
            // Manuais embutidos na própria página (fonte: toys/help/manual/*.md,
            // sincronizada por `node build/manual.mjs`).
            // ---------------------------------------------------------------

            var manuais = Object.create(null);

            Array.prototype.forEach.call(document.querySelectorAll('script[type="text/markdown"][data-manual]'), function (no) {
                manuais[no.dataset.manual] = {
                    titulo: no.dataset.title || no.dataset.manual,
                    html: renderizar(no.textContent.replace(/^\n+/, '').replace(/\s+$/, ''))
                };
            });

            // O índice do popup é montado a partir da grade: um card = uma entrada.
            Array.prototype.forEach.call(grid.querySelectorAll('[data-manual]'), function (card) {
                var slug = card.dataset.manual;
                var manual = manuais[slug];
                if (!manual) return;

                var botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'manual-nav-item';
                botao.dataset.manual = slug;

                var icone = card.querySelector('.bi');
                if (icone) {
                    var marca = document.createElement('i');
                    marca.className = icone.className;
                    marca.setAttribute('aria-hidden', 'true');
                    botao.appendChild(marca);
                }

                var rotulo = document.createElement('span');
                rotulo.textContent = manual.titulo;
                botao.appendChild(rotulo);

                nav.appendChild(botao);
            });

            var aberto = false;

            function abrir(slug, disparador) {
                var manual = manuais[slug];
                if (!manual) return;

                lastFocus = disparador || document.activeElement;
                titleEl.textContent = manual.titulo;
                contentEl.innerHTML = manual.html;
                contentEl.scrollTop = 0;

                Array.prototype.forEach.call(nav.querySelectorAll('.manual-nav-item'), function (botao) {
                    botao.classList.toggle('active', botao.dataset.manual === slug);
                });

                overlay.classList.add('open');
                document.body.classList.add('modal-aberto');
                aberto = true;
                closeBtn.focus();
            }

            function fechar() {
                if (!aberto) return;
                overlay.classList.remove('open');
                document.body.classList.remove('modal-aberto');
                aberto = false;
                if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
            }

            grid.addEventListener('click', function (evento) {
                var card = evento.target.closest('[data-manual]');
                if (card) abrir(card.dataset.manual, card);
            });

            nav.addEventListener('click', function (evento) {
                var botao = evento.target.closest('.manual-nav-item');
                if (botao) abrir(botao.dataset.manual, botao);
            });

            closeBtn.addEventListener('click', fechar);

            overlay.addEventListener('click', function (evento) {
                if (evento.target === overlay) fechar();
            });

            document.addEventListener('keydown', function (evento) {
                if (evento.key === 'Escape') fechar();
            });
        })();
    </script>
</body>
</html>
