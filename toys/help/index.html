<script>
    (function () {
        function syncThemeCss(cssText) {
            try {
                const css = cssText || localStorage.getItem('gantoys_theme_css');
                if (!css || !document.head) return;
                const existingStyle = document.getElementById('gantoys-theme-inject');
                if (existingStyle) existingStyle.remove();
                const style = document.createElement('style');
                style.id = 'gantoys-theme-inject';
                style.textContent = css;
                document.head.appendChild(style);
            } catch (e) {}
        }
        function applyTheme(theme, visual, cssText) {
            if (theme) document.documentElement.setAttribute('data-theme', theme);
            if (visual) document.documentElement.setAttribute('data-visual', visual);
            if (cssText) { try { localStorage.setItem('gantoys_theme_css', cssText); } catch (e) {} }
            syncThemeCss(cssText);
        }
        try { applyTheme(localStorage.getItem('theme') || 'dark', localStorage.getItem('visual') || 'glassmorphism', localStorage.getItem('gantoys_theme_css')); } catch (e) {}
        document.addEventListener('DOMContentLoaded', function () { syncThemeCss(); });
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'theme') applyTheme(e.data.theme, e.data.visual, e.data.css);
        });
    })();
</script>

    <script type="text/markdown" data-manual="index" data-title="Visão geral do GAN Toys">
# Visão geral do GAN Toys

O GAN Toys reúne utilitários jurídicos que rodam inteiramente no navegador. Cada ferramenta (chamada de toy) abre dentro da mesma janela, à direita do menu lateral, e trabalha somente com os arquivos que você escolher do seu computador.

## Requisitos

- Google Chrome ou Microsoft Edge atualizados. Os toys que leem e escrevem pastas usam a File System Access API, que não existe no Firefox e no Safari.
- Nenhuma instalação: o app é um arquivo HTML único. Nada é enviado para a internet e nenhuma conta é necessária.
- Um caminho local com espaço suficiente para os arquivos de saída. Os toys escrevem na pasta que você indicar.

## Passo a passo

1. Abra o app. Use o `dist/index.html` (entregável de arquivo único) ou o `index.html` da raiz do projeto durante o desenvolvimento. Duplo clique basta: tudo funciona aberto direto do disco, sem servidor.
2. Escolha um toy no menu lateral esquerdo. Cada item traz um ícone e o nome da ferramenta; o conteúdo abre na área principal, dentro de um quadro próprio.
3. Trabalhe dentro do toy. Em geral o fluxo é o mesmo em todos: escolher pasta de origem, escolher pasta de destino, preencher os campos, clicar no botão principal e acompanhar a barra de progresso.
4. Leia o resultado no fim da execução. Todo toy termina com um resumo (totais, sucessos e falhas) e um relatório por arquivo; as listas de erro podem ser copiadas para a área de transferência.
5. Volte ao início quando quiser (item `Início` no menu) ou troque de toy. O app guarda o último toy aberto e os campos preenchidos, então reabrir a página devolve o estado anterior.

## Navegação e interface

- O botão de seta no topo do menu compacta ou expande a barra lateral.
- O rodapé da barra lateral concentra o controle de tema: o botão de sol ou lua alterna entre claro e escuro.
- Dentro de um toy, os controles seguem sempre o mesmo vocabulário: campos com rótulo em caixa alta, contadores de linhas, botões primários para a ação principal, avisos em destaque e pílulas de estado.
- Toy em execução não é interrompido ao trocar de ferramenta: voltar ao toy mostra o estado salvo dos campos, mas a execução anterior precisa ser reiniciada.

## Temas e visuais

- São seis visuais: glassmorphism, neumorphism, neobrutalism, material, claymorphism e japandi. Cada um tem versão clara e escura.
- O conjunto de botões de visual no rodapé do menu muda conforme o tema: no escuro aparecem os visuais escuros, no claro aparecem os claros.
- A escolha do tema e do visual fica gravada no navegador e é aplicada a todos os toys, inclusive nos popups.

## Privacidade e arquivos

- A leitura e a escrita acontecem no seu disco, pelo navegador. Não há upload, servidor nem telemetria.
- A única exceção é o toy `Divisor Automático Santander`, que baixa a biblioteca de OCR `tesseract.js` de um CDN na primeira execução; por isso ele precisa de internet, enquanto os demais trabalham offline.
- O navegador pede a confirmação de leitura ou escrita na primeira vez que um toy abre uma pasta; a permissão vale para a sessão.

## Esta central de ajuda

- A grade acima lista os manuais, um por toy, na mesma ordem do menu lateral.
- Um clique abre o popup com o manual renderizado a partir do Markdown embutido na própria página.
- Dentro do popup, o índice da esquerda troca de manual sem fechar a janela. `Esc` ou o botão de fechar saem.
- O texto de cada manual fica em `toys/help/manual/<toy>.md`. Depois de editar, rode `node build/manual.mjs` para reembutir os arquivos na página.

## Detalhes técnicos

- Cada toy é uma página isolada em `toys/<nome>/index.html`, exibida em um `iframe` pelo app. Por isso um toy não interfere no outro nem enxerga o estado do vizinho.
- O estado dos formulários é salvo em `localStorage` sob a chave `toy_state_<toy>`, por `name` de campo, e restaurado quando o toy abre.
- O entregável `dist/index.html` embute o app, todos os toys e os recursos compartilhados em um único arquivo; os assets comuns existem uma só vez e chegam aos toys por Blob URLs criadas pelo documento principal.
    </script>

    <script type="text/markdown" data-manual="ganclassificadorvara" data-title="Classificador de Vara">
# Classificador de Vara

Classifica varas e juizados a partir de uma lista colada na tela, devolvendo tipo, número, classe e comarca de cada linha. A entrada é texto puro (uma vara por linha) e a saída é uma tabela exibida na própria página, também copiável em formato TSV.

## Requisitos

- Todo o processamento acontece no próprio navegador: nada é enviado para a internet.
- A entrada vem apenas do campo de texto da página; o toy não lê arquivos nem pastas.
- Cada vara deve ficar em uma linha. Linhas vazias são descartadas antes do processamento.

## Passo a passo

1. Cole a lista de varas e juizados no campo `Dados`, uma por linha.
2. Clique em `Processar`.
3. A seção `Resultado` aparece com o resumo acima da tabela.
4. Clique em `Copiar resultado` se precisar levar a tabela para outro programa. O rótulo do botão passa a `Copiado` e volta a `Copiar resultado` logo depois.
5. Clique em `Limpar` para esvaziar a entrada e voltar ao estado inicial.

## Campos e controles

- **Dados** — área de texto com o marcador `Cole os dados aqui...`. Aceita qualquer texto, sem validação de formato. A dica fixa acima do campo é `Cole os dados, um por linha.`
- **Processar** — reprocessa o conteúdo atual do campo e regrava a tabela.
- **Limpar** — apaga `Dados`, esconde a seção `Resultado`, limpa a tabela e devolve o foco ao campo de dados.
- **Copiar resultado** — copia as linhas da tabela em TSV (colunas separadas por tabulação, uma linha por registro, sem o cabeçalho). Se a área de transferência falhar, o toy usa uma cópia alternativa e ainda assim exibe `Copiado`.
- Este toy não tem campos de configuração: o bloco de ajustes fica oculto, porque o tipo `classify-court` não define nenhuma opção.

## Resultado

- Tabela com as colunas `Tipo`, `Nº`, `Classe` e `Comarca`, na mesma ordem das linhas não vazias da entrada.
- `Tipo` recebe `Juizados` quando a linha é identificada como juizado e `Comum` nos demais casos.
- `Classe` recebe `JEC` para juizados e `VC` para as varas comuns.
- Resumo exibido acima da tabela: `N linhas processadas.` (ou `1 linha processada.`).
- O toy não cria arquivos, pastas nem relatórios em disco.

## Avisos e limitações

- Linhas vazias (ou só com espaços) não entram na tabela, então a contagem do resumo pode ser menor que o número de linhas coladas.
- Quando a linha não traz nenhum número reconhecível, `Nº` recebe `0` para juizados e `1` para varas comuns.
- Não há validação de entrada nem mensagem de erro específica: o único erro previsto pelo código é `Ferramenta não configurada.`, exibido se o tipo da ferramenta deixar de ser reconhecido.
- A comarca é deduzida por heurística de texto. Linhas fora dos padrões tratados podem resultar em comarca incompleta ou vazia.

## Detalhes técnicos

- `Nº` é o primeiro número inteiro da linha, aceitando `ª`, `º` ou `°` logo depois dos dígitos. Se não houver dígitos, o toy procura palavra por palavra (ignorando espaços, pontos e hífens) por numerais escritos (`PRIMEIRA`/`PRIMEIRO` até `DECIMA`/`DECIMO`, de 1 a 10) e por numerais romanos de `I` a `X`.
- A linha é classificada como juizado quando contém `JEC` como palavra isolada, ou `JUIZADO`, ou `JUI` seguido de espaço ou ponto.
- Comarca: a linha é convertida para maiúsculas, perde um sufixo `/UF` de duas letras e pontos finais; se contiver `DA COMARCA DE `, aproveita o trecho posterior; se contiver ` - `, aproveita o trecho posterior ao separador. Em seguida, caracteres acentuados são reduzidos a ASCII e símbolos são removidos (mantendo letras, números, espaço, `_` e `-`), e são apagados os rótulos de tipo de órgão (`VARA CIVEL`, `VARA JUDICIAL`, `JUIZADO ESPECIAL CIVEL`, `JUIZADO ESPECIAL CIVEL E CRIMINAL`, `JUIZ ESP CIV`, `JUIZADO`), o ordinal (`1ª`, `PRIMEIRA`, `SEGUNDA`, ...), os numerais romanos e um `DE ` inicial.
- A divisão da entrada usa quebras de linha no padrão `\r?\n`, com remoção de espaços nas pontas e descarte de linhas vazias.

# Compressor de PDF em Lote

Reduz o tamanho de vários PDFs de uma vez: cada página é renderizada como imagem JPEG dentro de um PDF novo, montado página a página. A entrada é um lote de arquivos `.pdf` escolhidos no seletor de arquivos e a saída é o download automático de um arquivo `<nome>_comprimido.pdf` por PDF do lote.

## Requisitos

- Navegador com suporte a Canvas e a download por link; o toy não usa seleção de pastas nem File System Access API.
- O `pdf.js` e o `jsPDF` vêm do próprio projeto (`vendor/pdfjs/pdf.min.js` e `vendor/jspdf/jspdf.umd.min.js`), com o worker `vendor/pdfjs/pdf.worker.min.js`; nenhum recurso é baixado da internet.
- O seletor aceita apenas `.pdf` (múltipla seleção) e o toy descarta arquivos cujo tipo não seja `application/pdf`.
- Os PDFs ficam na sua máquina; nada é enviado para a internet.

## Passo a passo

1. Clique em `Selecionar PDFs` e escolha os arquivos do lote (use Ctrl+Clique para selecionar vários).
2. A seção `Arquivos do lote` dá lugar a `Configurações e processamento`, com a `Fila de Arquivos` na ordem em que os arquivos foram escolhidos.
3. Ajuste `Qualidade da Compressão` e `Resolução (DPI)`.
4. Clique em `Comprimir PDFs`. Durante o lote, `Comprimir PDFs` e `Limpar e Recomeçar` ficam desabilitados.
5. Acompanhe `Progresso Geral` e o estado de cada item da fila.
6. Ao terminar, a seção `Processamento Concluído!` aparece com o aviso `A compressão foi finalizada. Os arquivos foram baixados automaticamente.` e o aviso rápido `Sucesso` / `Processamento do lote concluído!`.
7. Clique em `Processar Novos Arquivos` para voltar à primeira etapa, ou em `Limpar e Recomeçar` para zerar a fila.

Se nenhum arquivo válido for escolhido, nada avança: aparece o aviso rápido `Aviso` / `Selecione arquivos PDF válidos.`

## Campos e controles

- **Qualidade da Compressão** — botões de rádio que definem a qualidade do JPEG de cada página: `Baixa (Maior Compressão)` (`0.4`), `Média (Recomendado)` (`0.6`, marcado por padrão) e `Alta (Menor Compressão)` (`0.8`).
- **Resolução (DPI)** — botões de rádio que definem a resolução de renderização: `50 DPI (Extrema)`, `72 DPI (Baixa)`, `150 DPI (Média)` (marcado por padrão) e `300 DPI (Alta)`.
- **Selecionar PDFs** — abre o seletor de arquivos (`.pdf`, múltipla seleção). A dica abaixo do botão é `Use Ctrl+Clique para selecionar vários arquivos.`
- **Comprimir PDFs** — inicia o lote. Fica desabilitado do início ao fim do processamento.
- **Limpar e Recomeçar** — zera a fila, limpa o seletor de arquivos, esconde as seções de configuração e de conclusão e volta para a etapa `Arquivos do lote`.
- **Processar Novos Arquivos** — botão da seção de conclusão; faz o mesmo que `Limpar e Recomeçar`.
- **Fila de Arquivos** — lista somente leitura. Cada item mostra o nome do arquivo, o tamanho original e uma etiqueta de estado: `Aguardando`, `Processando...`, `Concluído` ou `Erro`. A barra fina de cada item aparece apenas enquanto o arquivo está em processamento.

## Resultado

- Cada PDF concluído é baixado automaticamente com o nome `<nome original sem extensão>_comprimido.pdf`.
- O item da fila passa de `Original: <tamanho>` para `Original: <tamanho> -> Final: <tamanho> (Redução de X%)` quando o arquivo diminui; quando não diminui, mostra `Original: <tamanho> -> Final: Mantido (Já otimizado. Original mantido)` e o arquivo baixado é o original.
- Tamanhos são formatados em `Bytes`, `KB`, `MB` ou `GB`, com duas casas decimais.
- `Progresso Geral` mostra `N / M concluídos`, com a barra preenchida na proporção dos arquivos já tratados.
- O toy não grava pastas nem relatórios: os arquivos vão para a pasta de downloads do navegador.

## Avisos e limitações

- O PDF de saída é feito de imagens JPEG: o texto deixa de ser selecionável e buscável, e não há OCR.
- Se a compressão de um arquivo falhar, o item recebe `Erro`, aparece o aviso rápido `Erro` / `Falha ao comprimir <nome do arquivo>` e o lote segue para os demais arquivos.
- Se o resultado ficar maior que o original, o toy mantém o conteúdo original no arquivo baixado, ainda com o sufixo `_comprimido.pdf`.
- Um arquivo já `Concluído` ou com `Erro` é pulado se o processamento for acionado de novo sem limpar a fila.
- O lote é processado em sequência, um arquivo por vez, sem limite de quantidade definido no código.

## Detalhes técnicos

- O fator de renderização é `dpi / 72`, aplicado em `getViewport({ scale })` sobre um canvas oculto (`renderCanvas`); cada página é exportada com `toDataURL('image/jpeg', qualidade)`.
- O PDF de saída é montado com o jsPDF: a primeira página usa as dimensões originais da página de origem em pontos (`unit: 'pt'`, `format: [largura, altura]`) e a orientação `portrait` ou `landscape` conforme a proporção; as páginas seguintes são criadas com `addPage` nas mesmas dimensões. O documento é criado com `compress: true` e cada imagem é inserida ocupando a página inteira.
- O progresso por arquivo vai de 0 a 100 conforme as páginas são renderizadas; o progresso geral é recalculado ao término de cada arquivo.
- Os valores de qualidade (`0.4` / `0.6` / `0.8`) e de DPI (`50` / `72` / `150` / `300`) são lidos dos botões de rádio marcados; sem marcação, o código usa `0.6` e `150`.
- O download usa um link temporário com `URL.createObjectURL` e o atributo `download`.
    </script>

# Conversor de Rito

Converte as siglas de rito `VC` e `JEC` na descrição correspondente (`Comum` e `Juizados`). A entrada é uma lista de siglas colada na tela, uma por linha, e a saída é uma tabela de uma coluna exibida na própria página, também copiável em formato TSV.

## Requisitos

- O processamento roda inteiramente no navegador; nada é enviado para a internet.
- A entrada vem apenas do campo de texto da página; o toy não lê arquivos nem pastas.
- Cada sigla deve ficar em uma linha. Linhas vazias são descartadas antes do processamento.

## Passo a passo

1. Cole as siglas no campo `Dados`, uma por linha.
2. Clique em `Processar`.
3. A seção `Resultado` aparece com o resumo acima da tabela.
4. Clique em `Copiar resultado` para levar a coluna convertida para outro programa. O rótulo do botão passa a `Copiado` e volta a `Copiar resultado` logo depois.
5. Clique em `Limpar` para esvaziar a entrada e voltar ao estado inicial.

## Campos e controles

- **Dados** — área de texto com o marcador `Cole os dados aqui...`. Aceita qualquer texto, sem validação de formato. A dica fixa acima do campo é `Cole os dados, um por linha.`
- **Processar** — reprocessa o conteúdo atual do campo e regrava a tabela.
- **Limpar** — apaga `Dados`, esconde a seção `Resultado`, limpa a tabela e devolve o foco ao campo de dados.
- **Copiar resultado** — copia a coluna em TSV (uma linha por registro, sem o cabeçalho). Se a área de transferência falhar, o toy usa uma cópia alternativa e ainda assim exibe `Copiado`.
- Este toy não tem campos de configuração: o bloco de ajustes fica oculto, porque o tipo `convert-rito` não define nenhuma opção.

## Resultado

- Tabela com a coluna única `Convertido`, na mesma ordem das linhas não vazias da entrada.
- Resumo exibido acima da tabela: `N linhas processadas.` (ou `1 linha processada.`).
- O toy não cria arquivos, pastas nem relatórios em disco.

## Avisos e limitações

- A comparação é feita com a linha em maiúsculas, então `vc` e `jec` também são convertidos, mas apenas as siglas exatas: textos como `VARA CÍVEL` ou `JEC 2` saem exatamente como foram digitados (sem os espaços das pontas).
- Linhas vazias (ou só com espaços) não entram na tabela, então a contagem do resumo pode ser menor que o número de linhas coladas.
- Não há validação de entrada nem mensagem de erro específica: o único erro previsto pelo código é `Ferramenta não configurada.`, exibido se o tipo da ferramenta deixar de ser reconhecido.

## Detalhes técnicos

- A divisão da entrada usa quebras de linha no padrão `\r?\n`, com remoção de espaços nas pontas e descarte de linhas vazias.
- O mapeamento é exato após conversão para maiúsculas: `VC` vira `Comum`, `JEC` vira `Juizados` e qualquer outro valor é devolvido sem alteração.
- A cópia em TSV usa uma coluna por linha, sem cabeçalho, com os valores separados por tabulação e as linhas por quebra de linha.
    </script>

# Cópia Integral e Bradesco

Copia documentos por número de processo entre duas pastas locais, sem mover nem apagar nada na origem. A entrada é um par de pastas (origem e destino) mais as listas de números de processo e, na aba `Bradesco`, de pastas cliente; a saída são os arquivos copiados na pasta de destino e um relatório na tela com o que foi e o que não foi copiado.

## Requisitos

- Abra o arquivo no Google Chrome ou no Microsoft Edge: a seleção e a cópia das pastas usam a File System Access API.
- Permissão de leitura na pasta de origem e de permissão de escrita na pasta de destino, confirmada na hora da cópia.
- A busca percorre a pasta de origem inteira, incluindo as subpastas.
- Nenhum arquivo é enviado para a internet: a cópia é local.

## Passo a passo

### Modo `Arquivo`

1. Mantenha a aba `Arquivo` selecionada.
2. Em `Pasta de origem`, clique em `Selecionar origem` e confirme no diálogo `Selecionar pasta`. O nome da pasta escolhida substitui o texto `Nenhuma pasta selecionada`.
3. Em `Pasta de destino`, clique em `Selecionar destino` e confirme do mesmo modo.
4. Cole os números dos processos no campo `Números dos processos`, um por linha.
5. Clique em `Copiar arquivos` (o botão só habilita com origem, destino e pelo menos um processo).
6. Acompanhe a barra de progresso enquanto a origem é varrida.
7. Confira os contadores e os quadros `Copiados` e `Não copiados`.

### Modo `Bradesco`

1. Clique na aba `Bradesco`.
2. Selecione a pasta de origem com `Selecionar origem` e a de destino com `Selecionar destino`, como no outro modo.
3. Cole os números dos processos em `Números dos processos`, um por linha.
4. Cole as pastas cliente em `Pastas cliente`, uma por linha, na mesma ordem dos processos: o primeiro processo recebe a primeira pasta cliente, e assim por diante.
5. Confira a linha de validação abaixo dos campos.
6. Clique em `Copiar e renomear PDFs` (habilita apenas com as duas listas do mesmo tamanho).
7. Acompanhe a barra e, no fim, os contadores e os quadros de resultado.

### Depois da cópia

1. O texto da barra termina em `Cópia concluída.`; quando nenhum arquivo corresponde, a aba `Arquivo` mostra `Nenhum arquivo correspondente foi encontrado.`
2. Cada linha do quadro `Não copiados` vem precedida de um estado: `NÃO LOCALIZADO`, `IGUAL` ou `ERRO`.
3. Use `Copiar lista` no quadro `Não copiados` para copiar apenas os números dos processos dessas linhas, um por linha e sem repetir. O rótulo do botão vira `Copiado` por instantes e volta a `Copiar lista`.
4. Rodar a cópia de novo limpa os quadros e os contadores antes de recomeçar.

## Campos e controles

- **Abas `Arquivo` e `Bradesco`** — trocam o painel exibido. A aba `Arquivo` abre a seção `Cópia por número de processo`, com a descrição de que localiza todos os arquivos cujo nome contenha um dos processos informados e os copia mantendo o nome original; a aba `Bradesco` abre `Cópia e renomeação de iniciais`. Cada aba mantém as suas próprias pastas, listas e resultados; trocar de aba não apaga o que já foi feito na outra.
- **Selecionar origem** — abre o diálogo de pasta em modo somente leitura. O nome escolhido substitui `Nenhuma pasta selecionada`. Cancelar a seleção não altera o que já estava escolhido.
- **Selecionar destino** — o mesmo diálogo, em modo de leitura e escrita.
- **Números dos processos** — uma linha por processo; o contador ao lado mostra `N processos` (ou `1 processo`). Os exemplos do marcador são `12345` e `0001234-56.2026.8.00.0000`. Linhas vazias são ignoradas e a busca percorre também as subpastas da origem.
- **Pastas cliente** — só na aba `Bradesco`; uma linha por pasta, com o contador `N pastas` (ou `1 pasta`). A linha de validação abaixo das listas mostra `Informe os processos e as pastas cliente.` quando as duas estão vazias, `As listas precisam ter a mesma quantidade: N processo(s) e M pasta(s).` quando os tamanhos divergem, ou `N correspondência(s) pronta(s) para cópia.` quando estão pareadas. A dica fixa é `A ordem das linhas define a correspondência: o primeiro processo recebe a primeira pasta cliente, e assim por diante.`
- **Copiar arquivos** (aba `Arquivo`) — habilita só com origem, destino e ao menos um processo.
- **Copiar e renomear PDFs** (aba `Bradesco`) — habilita só com origem, destino e as duas listas com a mesma quantidade de linhas.
- **Copiar lista** — habilita quando existe pelo menos um processo no quadro `Não copiados`; copia somente os números desses processos, sem caminhos e sem mensagens.

## Resultado

Na aba `Arquivo`:

- É copiado todo arquivo de qualquer subpasta da origem cujo nome ou caminho contenha um dos processos informados, mantendo o nome original. Vários arquivos podem atender ao mesmo processo.
- O contador `Encontrados` conta os arquivos que casaram com algum processo; `Copiados` e `Não copiados` dividem esse total.
- Cada linha do quadro `Copiados` traz o caminho relativo do arquivo na origem e o estado `COPIADO` ou `ATUALIZADO`.
- Processos sem nenhum arquivo recebem a linha `NÃO LOCALIZADO` com a mensagem `<processo>: nenhum arquivo localizado na origem.`
- Quando nada é encontrado, o total fica em zero e aparece a linha `Nenhum arquivo encontrado para os processos informados.`

Na aba `Bradesco`:

- Para cada processo, o primeiro PDF localizado na origem é copiado com o nome `INICIAL <pasta cliente>.pdf`, usando a pasta cliente da mesma posição da lista.
- O contador `Processos` mostra o tamanho da lista de processos; `Copiados` e `Não copiados` dividem esse total.
- Cada linha do quadro `Copiados` mostra `<processo> -> INICIAL <pasta cliente>.pdf`, com o estado `COPIADO` ou `ATUALIZADO`.
- Processos sem PDF recebem a linha `NÃO LOCALIZADO` com a mensagem `<processo>: nenhum PDF localizado.`

Nas duas abas, os quadros `Copiados` e `Não copiados` só aparecem quando têm conteúdo, e o destino é sempre a pasta escolhida em `Selecionar destino` (sem recriar as subpastas da origem).

## Avisos e limitações

- Erros de seleção de pasta aparecem em uma caixa de alerta do navegador com a mensagem do erro, ou `Não foi possível selecionar a pasta.` quando não há mensagem; se a seleção não responder em 60 segundos, o erro é `A seleção de pasta não respondeu.`
- Se a cópia ficar 2 minutos sem enviar progresso, o processo é interrompido com `A operação de cópia não respondeu.` e a barra mostra `Não foi possível concluir a cópia.`
- Se as pastas escolhidas não estiverem mais disponíveis, a cópia falha com `Selecione novamente as pastas de origem e destino.`; sem permissão, falha com `É necessário conceder permissão de leitura na origem e escrita no destino.`
- Um arquivo já existente no destino com o mesmo conteúdo não é recopiado: entra no quadro `Não copiados` com o estado `IGUAL` e o motivo `já existe no destino com o mesmo conteúdo`. Se o arquivo do destino for o mesmo arquivo da origem, o motivo é `origem e destino são o mesmo arquivo`.
- Um arquivo já existente com conteúdo diferente é sobrescrito, recebe o estado `ATUALIZADO` e o sufixo ` (sobrescrito)` no relatório. O toy não pergunta antes de sobrescrever.
- No modo `Bradesco` só entram arquivos com nome terminando em `.pdf` e cada processo consome apenas o primeiro PDF que casar.
- O destino é plano: arquivos vindos de subpastas diferentes com o mesmo nome caem na mesma pasta, e o último processado sobrescreve o anterior.
- Nada é movido, renomeado ou apagado na origem; ao final, o texto da barra de progresso continua mostrando a contagem de `analisado(s)` e `copiado(s)`.

## Detalhes técnicos

- Correspondência de processo: cada número informado é normalizado uma vez (texto em minúsculas e apenas os dígitos). Um arquivo casa quando o caminho em minúsculas contém o processo informado (para processos com algum caractere não numérico) ou quando os dígitos do caminho contêm todos os dígitos do processo.
- O relatório marca como copiados os estados `ok` (arquivo novo) e `updated` (sobrescrito); `same`, `missing` e `fail` vão para `Não copiados`.
- Durante a varredura, o progresso é enviado no máximo a cada 120 milissegundos e a barra fica cheia, com o texto `N analisado(s) | M copiado(s)`; o texto inicial é `Procurando e copiando arquivos...` (aba `Arquivo`) ou `Procurando e copiando PDFs...` (aba `Bradesco`).
- A comparação de conteúdo entre origem e destino é feita em blocos de 1 MiB, com comparação prévia de tamanho.
- A gravação usa um fluxo de escrita que trunca o arquivo de destino, por isso um arquivo existente é sempre sobrescrito e nunca renomeado com sufixo.
    </script>

    <script type="text/markdown" data-manual="gannovodiv" data-title="Divisor Automático Santander">
# Divisor Automático Santander

Localiza a Petição Inicial dentro de PDFs de processo integral e grava a Inicial separada dos demais documentos, um par de arquivos por processo. Entram PDFs nomeados com o número CNJ; saem `Inicial_<CNJ>.pdf`, `Docs_<CNJ>.pdf`, um relatório na tela e um CSV.

## Requisitos

- O toy precisa rodar dentro do aplicativo GAN Toys: a escolha da pasta de destino e a gravação dos arquivos são pedidas ao aplicativo hospedeiro por mensagem. Fora do host, não existe seletor de pasta e o processamento nem começa.
- `pdf-lib` e `pdf.js` são carregados do próprio projeto (`../../vendor/pdf-lib/pdf-lib.min.js` e `../../vendor/pdfjs/pdf.min.js`, com worker em `../../vendor/pdfjs/pdf.worker.min.js`); nenhum download é feito para eles.
- O OCR de emergência depende da CDN `https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js`. Sem internet o OCR não existe: o arquivo que precisaria dele falha em vez de ser lido como imagem.
- Cada PDF precisa ter o número CNJ no nome, no padrão `0000000-00.0000.0.00.0000`. Arquivos cujo nome começa com `Inicial` ou `Docs` são descartados da fila.
- Extração de texto e montagem dos PDFs acontecem na máquina do usuário; nada é enviado para servidores.

## Passo a passo

1. Clique na área de seleção (`Clique para selecionar ou arraste os PDFs aqui`) ou arraste os arquivos para ela. A contagem passa a aparecer no formato `N arquivo(s) na fila`.
2. Clique em `Avançar e Escolher Destino`. O aplicativo hospedeiro abre o seletor de pasta; escolha onde os PDFs serão gravados.
3. Acompanhe o passo `Processamento`: a linha de status mostra `Analisando 1 de N: <arquivo>`, a barra avança em porcentagem, os contadores `Total`, `Concluídos`, `A Revisar` e `Erros` são atualizados a cada arquivo e o log registra `Lendo bytes de ...`, `Detectando limites...`, `Separando PDF (início a fim)...` e `Salvo com sucesso.`
4. Ao terminar, o passo `Auditoria` é ativado e aparece a mensagem `Os resultados foram guardados em <pasta>.`
5. Clique em `Ver Relatório` para abrir `Relatório Detalhado` e conferir a linha de cada processo.
6. Na coluna `Visualizar`, use `Inicial` ou `Docs` para abrir o PDF gerado, ou `Corrigir` para refazer a divisão à mão.
7. Clique em `Exportar CSV` para baixar o relatório, ou em `Novo Processamento` para voltar ao início.

## Campos e controles

- **Clique para selecionar ou arraste os PDFs aqui** — área de clique e de arraste; aceita vários arquivos `.pdf` de uma vez.
- **N arquivo(s) na fila** — contagem da fila válida; só aparece depois de uma seleção aceita.
- **Avançar e Escolher Destino** — inicia o lote; só funciona com a pasta escolhida no host.
- **Refazer seleção** — limpa fila, relatório, contadores, barra e log, e volta ao passo 1.
- **Ver Relatório** — abre o relatório; disponível apenas depois do processamento.
- **Exportar CSV** — baixa o CSV do relatório; sem dados, não faz nada.
- **Novo Processamento** — mesmo efeito de `Refazer seleção`.
- **Inicial** e **Docs** — abrem o arquivo gerado no visualizador nativo do navegador, sem controles de zoom próprios.
- **Corrigir** — abre o arquivo original no visualizador próprio, com os campos `Início` e `Fim` preenchidos com o intervalo detectado.
- **Marcar Início** e **Marcar Fim** — copiam a página que está sendo exibida para os campos `Início` e `Fim`.
- **Início** e **Fim** — números inteiros, mínimo 1; definem o intervalo da Inicial na correção manual.
- **Dividir** — grava a divisão manual por cima dos arquivos do processo e marca a linha do relatório com a origem `Manual`.
- **Fit** — reajusta a página ao quadro; sem zoom manual o rótulo é `Fit`, com zoom manual o rótulo passa a mostrar o percentual aplicado.
- **Pág N de M** — campo numérico de página; valores fora de 1 e do total são ignorados.
- **Contadores do painel** — `Total`, `Concluídos`, `A Revisar` e `Erros`.
- **Coluna Status do relatório** — selo `OK`, selo `Revisar` ou o texto `Erro: <mensagem>`.

## Resultado

- Na pasta escolhida: `Inicial_<CNJ>.pdf` com as páginas detectadas da petição e `Docs_<CNJ>.pdf` com todas as páginas restantes, na ordem do original. O arquivo de documentos só é criado quando existem páginas fora do intervalo da Inicial.
- Ao final da tela de processamento, além do caminho da pasta, pode aparecer `Atenção: N processo(s) geraram dúvidas algorítmicas e requerem revisão humana.`
- `Relatório Detalhado` com as colunas `Arquivo`, `Páginas Iniciais` (formato `12 a 34 (23p)`), `Visualizar` e `Status`.
- CSV baixado como `NovoDiv_Relatorio_<data-hora>.csv`, em UTF-8 com marca de ordem de bytes, separado por ponto e vírgula e com as colunas `Arquivo`, `CNJ`, `Pagina_Inicial`, `Pagina_Final`, `Total_Paginas_Peticao`, `Status`, `Precisa_Revisao`, `Flags` e `Mensagem_Erro`. Em `Status` os valores são `OK`, `REVISAR` e `ERRO`; em `Precisa_Revisao`, `SIM` ou `NÃO`.

## Avisos e limitações

- `Nenhum PDF válido selecionado.` — a seleção ou o arraste não trouxe nenhum arquivo `.pdf`.
- `Nenhum PDF Integral encontrado. Certifique-se de que o nome contém o número CNJ.` — nenhum arquivo passou no filtro de nome.
- `É necessário selecionar uma pasta de destino para salvar os PDFs.` — a escolha de pasta falhou ou estourou o limite de espera, que é de 120 segundos; nesse caso o erro interno é `A operação com a pasta não respondeu.`
- `Não detectou início (mesmo com OCR)` — o arquivo entra como erro no relatório e o lote continua.
- `Não foi possível carregar o PDF gerado: <mensagem>` — falha ao ler o arquivo gravado para visualização.
- `Arquivo original não encontrado na memória.` e `Erro ao abrir PDF para edição visual: <mensagem>` — falhas ao abrir o modo de correção.
- `Intervalo de páginas inválido.` — `Início`/`Fim` vazios, menores que 1 ou em ordem invertida.
- `Divisão manual concluída e sobrescrita com sucesso!` — a correção substitui os arquivos do processo e remove a pendência de revisão.
- Um arquivo com erro não interrompe o lote: os demais são processados e a contagem `Erros` aumenta.
- O CNJ é lido apenas do nome do arquivo; sem ele o arquivo nem entra na fila.
- Repetir o lote na mesma pasta sobrescreve `Inicial_<CNJ>.pdf` e `Docs_<CNJ>.pdf` dos processos já feitos.
- O toy não valida o conteúdo jurídico do resultado e não corrige o intervalo sem intervenção: quando a detecção termina com dúvida, a linha vai para revisão humana.

## Detalhes técnicos

- O texto de cada página é extraído pelo `pdf.js` juntando os itens; uma quebra de linha é inserida quando a diferença de posição vertical entre itens passa de 2.
- Páginas de sistema são ignoradas: página com menos de 50 caracteres, cabeçalho com marcadores como `PÁGINA DE SEPARAÇÃO`, `Nº do processo`, `Data de autuação`, `Classe:`, `Órgão julgador:`, `Assunto:` ou `Número:`, ou página com menos de 500 caracteres que contenha `PROCESSO`.
- O identificador de documento é procurado no início do texto: `Num. N - Pág. N` (PJe), `Id. N - Pág. N` (Projudi) e `Evento N, NOME,` (eproc). A troca de identificador indica onde um documento termina e o outro começa.
- Início: a primeira página não-sistema que traz saudação a juízo, como `EXCELENTÍSSIMO`, `AO DOUTO JUÍZO`, `AO JUÍZO`, `EXMO. SR. DR. JUIZ`, `JUÍZO DE DIREITO DA VARA`, `MERITÍSSIMO` ou `DEFENSORIA PÚBLICA`. Sem nenhuma delas, vale a primeira página não-sistema com mais de 200 caracteres. Processo originado em PROCON começa na primeira página de notificação encontrada entre as 20 primeiras.
- Fim: é escolhida a menor página entre os candidatos, na ordem identificador de documento, início de novo documento por conteúdo, fechamento confirmado por OAB e Defensoria seguido de novo documento, fechamento sem OAB e fechamento isolado.
- Documento novo por conteúdo é reconhecido por início de página, entre outros: `PROCURAÇÃO`, `Resumo`, `CREDNET`, `SERASA`, `SPC Brasil`, `Calculadora`, `INSS`, `QR-CODE`, `fls.` com número, `Processo:` com número, `TERMO DE NOTIFICAÇÃO`, `Para conferir o original`, carteira de trabalho, RG, `COMPROVANTE`, `DECLARAÇÃO`, `Termo de Audiência` e `CERTIDÃO`.
- O fechamento da petição é reconhecido por fórmulas como `Pede deferimento`, `Pede-se deferimento`, `Confia e espera deferimento`, `Confia no deferimento`, `Termos em que`, `Nestes termos`, `Dá-se a causa`, `Sendo assim`, `consumidora requer` e `VALOR DA CAUSA`. Ocorrências cujo texto seguinte começa por `da`, `do`, `de`, `a` ou `o` são descartadas por parecerem continuação de frase.
- Também contam como sinal de fim, nas últimas 20 linhas da página, a presença de `OAB/` ou `OAB` seguido de número, de Defensoria Pública, de `valor da causa` ou `Dá-se a causa`, de `Valor: R$` e de `fls.` com número.
- Refinamento de início: se a primeira candidata tiver 2 páginas ou menos, o algoritmo procura adiante outra candidata e adota a que tiver pelo menos o dobro de páginas; em processo eproc, um documento `INIC1`, `INIC` ou `PET1` pode deslocar o início, e um `TERMO` posterior a um único `INIC1` passa a valer como início.
- Confiança de 0 a 5: soma 2 para início por padrão ou por `INIC1` e 2 para fim por identificador, conteúdo ou fechamento confirmado; início alternativo, por `TERMO2` ou PROCON e fim sem OAB somam 1. Intervalos menores que 3 páginas ou maiores que 60 páginas perdem 1 ponto. Pontuação final abaixo de 3 ou qualquer ocorrência sinalizada marcam o processo como `Revisar`.
- OCR: `Tesseract.createWorker('por')`, com cada página renderizada em canvas na escala 1.5. A varredura cobre as 10 primeiras páginas quando o texto inicial tem menos de 500 caracteres, e depois continua pelas páginas sem texto até encontrar fechamento com OAB; as mensagens são `[!] Imagem sem texto detectada. Iniciando OCR de emergência...` e `> Lendo pág N com OCR...`.
- Visualizador próprio: a roda do mouse troca uma página por vez, com pausa de gesto de 120 ms, impulso de 400 por página e intervalo mínimo de 160 ms entre trocas. O zoom anda em passos de 0,2, com mínimo de 0,4, e o ajuste `Fit` calcula a escala pela área visível descontando 40 pixels de largura e 80 de altura.
- A divisão usa `pdf-lib`: copia as páginas do intervalo para o arquivo da Inicial e as páginas antes e depois do intervalo, na ordem original, para o arquivo de documentos. Os bytes são gravados pelo aplicativo hospedeiro.

### Adicionar uma regra de divisão sem quebrar as antigas

Regra nova nunca pode mudar o resultado de um processo que já dividia certo. Toda divisão conhecida está congelada em `test/golden/novodiv-regras.json`: um caso para cada padrão de início, um para cada padrão de fechamento, os classificadores de página (sistema, documento novo, identificador) e os casos de pontuação.

1. Acrescente o padrão na tabela certa de `toys/gannovodiv/index.html`: `START_PATTERNS` (saudação a juízo), `CLOSING_PATTERNS` (fechamento da petição) ou os marcadores usados por `isSystemPage`.
2. Rode `npm test`. O teste `test/toys/gannovodiv-regras.test.js` reprova de propósito em dois pontos: o inventário de regras mudou e a regra nova ainda não tem caso.
3. Acrescente em `testkit/novodiv.js` um fragmento realista da página do processo novo, na lista correspondente (`FRAGMENTOS_DE_INICIO` ou `FRAGMENTOS_DE_FIM`, na mesma posição da tabela), e rode `GANTOYS_ATUALIZAR_GOLDEN=1 node --test test/toys/gannovodiv-regras.test.js` para registrar o caso.
4. Rode `npm test` outra vez. Nenhum caso antigo pode ter mudado; se mudou, o teste aponta o processo e a regra (`regra(s) N passaram a casar página antiga`, `a divisão do caso X mudou`). Estreite o padrão novo em vez de aceitar o resultado novo.
5. Confira `git diff test/golden/novodiv-regras.json`: o diff deve conter apenas as adições do processo novo.

Se a regra nova for mesmo mais específica e precisar ganhar de uma antiga, isso é reordenação de tabela: registre o caso afetado, explique no commit e revise o diff do golden caso a caso.
    </script>
