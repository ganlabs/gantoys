<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function () {
            function syncThemeCss(cssText) {
                try {
                    const css = cssText || localStorage.getItem('gantoys_theme_css');
                    if (!css || !document.head) return;

                    const existingStyle = document.getElementById('gantoys-theme-inject');
                    if (existingStyle) existingStyle.remove();

                    const style = document.createElement('style');
                    style.id = 'gantoys-theme-inject';
                    style.textContent = css;
                    document.head.appendChild(style);
                } catch (e) {}
            }

            function applyTheme(theme, visual, cssText) {
                if (theme) document.documentElement.setAttribute('data-theme', theme);
                if (visual) document.documentElement.setAttribute('data-visual', visual);
                if (cssText) {
                    try { localStorage.setItem('gantoys_theme_css', cssText); } catch (e) {}
                }
                syncThemeCss(cssText);
            }

            try { applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), localStorage.getItem('visual') || 'glassmorphism', localStorage.getItem('gantoys_theme_css')); } catch (e) {}

            document.addEventListener('DOMContentLoaded', function () {
                syncThemeCss();
            });

            window.addEventListener('message', function (e) {
                if (e.data && e.data.type === 'theme') {
                    applyTheme(e.data.theme, e.data.visual, e.data.css);
                }
            });

            function forwardPointer(e) {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'toy-pointer', x: e.clientX, y: e.clientY }, '*');
                    }
                } catch (err) {}
            }

            window.addEventListener('pointermove', forwardPointer, { capture: true, passive: true });
            window.addEventListener('mousemove', forwardPointer, { capture: true, passive: true });
        })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juntar PDFs</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../shared/toy.css">
  <link rel="stylesheet" href="../../vendor/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../../vendor/pdf-lib/pdf-lib.min.js"></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="brand-logo" src="../../favicon.png" alt="GAN">
      <h1>Juntar PDFs</h1>
      <p>Una os PDFs de cada subpasta do diretório escolhido em um único arquivo.</p>
    </header>

    <section class="glass-card" aria-label="Juntar PDFs por subpasta">
      <div class="panel">
        <div class="card-heading">
          <h2>Selecionar Pasta</h2>
          <p>Escolha a pasta que contém as subpastas com os PDFs a unir.</p>
        </div>

        <button class="btn btn-primary btn-block" id="folderBtn">
          <i class="bi bi-folder2-open" aria-hidden="true"></i>
          <span>Selecionar Pasta</span>
        </button>
        <input type="file" id="folderInput" hidden webkitdirectory directory multiple accept=".pdf,application/pdf">

        <div class="tile tile-accent stack hidden" id="folderInfo">
          <div class="folder-path muted" id="folderPath"></div>
          <div class="row row-center">
            <div class="stat">
              <strong id="folderCount">0</strong>
              <span>Pastas</span>
            </div>
            <div class="stat">
              <strong id="pdfCount">0</strong>
              <span>PDFs</span>
            </div>
          </div>
        </div>

        <div class="subfolders-list hidden" id="subfoldersList"></div>

        <button class="btn btn-primary btn-block" id="mergeBtn" disabled>
          <i class="bi bi-link-45deg" aria-hidden="true"></i>
          <span>Juntar PDFs</span>
        </button>

        <div class="progress-area" id="progressContainer">
          <div class="progress-top">
            <span id="progressCurrent">-</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar" id="progressFill"></div>
          </div>
          <p class="progress-detail" id="progressDetail">-</p>
        </div>
      </div>
    </section>

    <section class="glass-card hidden" id="results">
      <div class="panel">
        <div class="card-heading">
          <h2>Resultados</h2>
        </div>
        <div class="result-list" id="resultsList"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
