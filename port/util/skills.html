<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills — util</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1f26;--surface:#fff;--border:#dadce0;--primary:#ffc107;--primary-hover:#e0a800;--text:#1f1f1f;--text-secondary:#5f6368;--text-helper:#80868b;--radius:8px;--radius-lg:16px;--shadow:0 10px 30px rgba(0,0,0,0.5)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 110%,#ffc107 0%,#ffc107 15%,#3a4249 65%,#1a1f26 100%);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:30px;min-height:100vh}

/* Header fora do card */
.app-header{display:flex;align-items:center;gap:24px;margin-bottom:20px}
.app-header h1{font-size:1.15rem;font-weight:500;color:#fff;letter-spacing:.05em;opacity:.9}
.logo{height:40px;border-radius:4px}

/* Card principal */
.main-card{background-color:var(--surface);width:100%;max-width:98vw;flex:1;border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}

/* Nav bar (dentro do card, como actions-bar do cadastro) */
.nav-bar{display:flex;gap:8px;padding:16px 24px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;align-items:center;flex-wrap:wrap}
.nav-bar::-webkit-scrollbar{display:none}
.nav-bar a{display:inline-flex;align-items:center;padding:8px 16px;text-decoration:none;color:var(--text-secondary);font-size:13px;font-weight:600;border-radius:var(--radius);border:1px solid transparent;transition:all .2s;white-space:nowrap}
.nav-bar a:hover{background:#fff8e1;color:var(--text)}
.nav-bar a.active{background:var(--primary);color:#000;border-color:var(--primary)}

/* Conteudo do card */
.card-content{flex:1;padding:24px 32px;overflow-y:auto}

/* Skill sections */
.skill-section{display:none}.skill-section.active{display:block}
.skill-section h2{font-size:22px;font-weight:700;margin-bottom:4px}
.skill-section .desc{color:var(--text-secondary);font-size:14px;margin-bottom:20px}

/* Input */
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row textarea{flex:1;min-height:100px;padding:12px;font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);resize:vertical;outline:none;transition:border .15s}
.input-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,193,7,.15)}

/* Botoes */
.btn-stack{display:flex;flex-direction:column;gap:8px}
.btn-stack .btn,.btn-stack .btn-copy{width:100%;text-align:center}
.btn{padding:10px 24px;background:var(--primary);color:#000;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-start;transition:all .15s}
.btn:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,193,7,.3)}
.btn-copy{padding:10px 24px;background:#e8e8e8;color:var(--text);border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-copy:hover{background:#d0d0d0}

/* Output */
.output-wrap{margin-top:4px}
.output-wrap h3{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.output-table{border-collapse:collapse;font-size:13px;font-family:"SF Mono","Fira Code","Consolas",monospace;width:100%}
.output-table th,.output-table td{padding:6px 12px;text-align:left;border:1px solid var(--border)}
.output-table th{background:#f8f9fa;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary)}
.output-table td{background:var(--surface);white-space:pre-wrap;word-break:break-all}
.output-table tr:hover td{background:#fff8e1}

/* Params */
.params{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.params label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.params input[type=text]{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;width:140px;outline:none}
.params input[type=text]:focus{border-color:var(--primary)}
.params input[type=checkbox]{accent-color:var(--primary)}

/* Status bar (rodape do card) */
.status-bar{display:flex;justify-content:flex-end;padding:6px 24px;background:#f8f9fa;font-size:12px;border-top:1px solid var(--border);color:var(--text-secondary)}

/* Erros */
.err{color:#dc2626;font-size:13px;padding:8px 0}
.remmina-warn{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:8px}

/* Responsivo */
@media(max-width:720px){body{padding:12px}.app-header{gap:12px;margin-bottom:12px}.app-header h1{font-size:.95rem}.logo{height:32px}.main-card{border-radius:12px}.nav-bar{padding:10px 16px}.card-content{padding:16px}.modal{width:100%;max-width:100%!important;top:auto;bottom:0;left:0;transform:none;border-radius:16px 16px 0 0}}
@media(max-width:480px){body{padding:0;height:100dvh;overflow:hidden}.app-header{padding:8px 12px 0;margin-bottom:0;gap:8px}.app-header h1{font-size:.85rem;letter-spacing:0}.logo{height:26px}.main-card{border-radius:0;max-width:100vw;height:100%}.nav-bar{padding:6px 8px;gap:6px}.card-content{padding:12px}}
</style>
</head>
<body>
<header class="app-header">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h1>Skills — util</h1>
</header>
<div class="main-card">
    <nav class="nav-bar" id="nav"></nav>
    <main class="card-content" id="main"></main>
    <div class="status-bar"><span id="skill-count"></span></div>
</div>
